<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SofIA</title>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // Fuerza el runtime "classic" a nivel de preset para evitar el error
    // "importSource cannot be set when runtime is classic" en versiones nuevas de Babel.
    Babel.registerPreset("app", {
      presets: [
        [Babel.availablePresets["env"], {}],
        [Babel.availablePresets["react"], { runtime: "classic" }]
      ]
    });
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-base:#0d0f14; --bg-sidebar:#13161e; --bg-card:#1a1d27; --bg-input:#20243a;
      --accent:#bbd531; --accent-dim:#2d5cb8; --text-main:#e8eaf0; --text-muted:#6b7280;
      --text-dim:#9ca3af; --bubble-user:#1e3a6e; --bubble-bot:#1a1d27;
      --border:#2a2d3e; --shadow:0 4px 24px rgba(0,0,0,0.4); --radius:14px;
    }
    html,body,#root{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg-base);color:var(--text-main);}
    .app{display:flex;height:100vh;overflow:hidden;}
    .sidebar{width:260px;min-width:260px;background:var(--bg-sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 16px;gap:24px;}
    .sidebar-logo{display:flex;align-items:center;padding:4px 8px;justify-content:center;}
    .logo-img{height:70px;width:auto;object-fit:contain;}
    .new-chat-btn{display:flex;align-items:center;gap:8px;background:var(--bg-input);border:1px solid var(--border);color:var(--text-main);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px;font-weight:500;transition:all .15s;}
    .new-chat-btn:hover{background:var(--bg-card);border-color:var(--accent);}
    .sidebar-section-title{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);padding:0 8px;}
    .chat-history{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;}
    .history-item{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-dim);overflow:hidden;transition:background .15s;display:flex;align-items:center;gap:4px;}
    .history-item:hover{background:var(--bg-card);color:var(--text-main);}
    .history-item.active{background:var(--bg-input);color:var(--text-main);}
    .history-item-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .history-delete-btn{flex-shrink:0;background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:17px;line-height:1;padding:0 2px;border-radius:4px;opacity:0;transition:opacity .15s,color .15s;}
    .history-item:hover .history-delete-btn{opacity:1;}
    .history-delete-btn:hover{color:#ef4444;}
    .sidebar-footer{border-top:1px solid var(--border);padding-top:16px;display:flex;align-items:center;gap:10px;}
    .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#171352,#303483);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;}
    .user-info{flex:1;overflow:hidden;}
    .user-name{font-size:13px;font-weight:600;}
    .user-role{font-size:11px;color:var(--text-muted);}
    .chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
    .chat-header{padding:16px 28px;border-bottom:1px solid var(--border);background:var(--bg-base);display:flex;align-items:center;justify-content:space-between;}
    .chat-header-title{font-size:15px;font-weight:600;}
    .chat-header-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
    .status-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:#bbd531;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.2);border-radius:20px;padding:4px 12px;}
    .status-dot{width:6px;height:6px;border-radius:50%;background:#bbd531;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .messages-area{flex:1;overflow-y:auto;padding:28px;display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth;}
    .messages-area::-webkit-scrollbar{width:7px;}
    .messages-area::-webkit-scrollbar-track{background:rgba(255,255,255,0.03);border-radius:4px;}
    .messages-area::-webkit-scrollbar-thumb{background:rgba(187,213,49,0.35);border-radius:4px;}
    .messages-area::-webkit-scrollbar-thumb:hover{background:rgba(187,213,49,0.65);}
    .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px;text-align:center;padding:40px;}
    .welcome-icon{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#ffffff,#ffffff);display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:8px;}
    .welcome h2{font-size:22px;font-weight:700;}
    .welcome p{color:var(--text-muted);font-size:14px;max-width:400px;line-height:1.6;}
    .suggestions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;}
    .suggestion-chip{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--text-dim);transition:all .15s;}
    .suggestion-chip:hover{border-color:var(--accent);color:var(--text-main);background:var(--bg-input);}
    .msg-row{display:flex;gap:12px;align-items:flex-start;}
    .msg-row.user{flex-direction:row-reverse;}
    .msg-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
    .msg-avatar.bot-av{background:linear-gradient(135deg,#4f8ef7,#7c5cfc);margin-top:2px;}
    .msg-avatar.user-av{background:var(--bubble-user);border:1px solid var(--accent-dim);}
    .bubble{max-width:70%;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.65;word-break:break-word;}
    .bubble.user-bubble{background:var(--bubble-user);border:1px solid var(--accent-dim);border-bottom-right-radius:4px;color:var(--text-main);}
    .bubble.bot-bubble{background:var(--bubble-bot);border:1px solid var(--border);border-bottom-left-radius:4px;}
    .bubble-time{font-size:11px;color:var(--text-muted);margin-top:4px;}
    .bubble table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;}
    .bubble th{background:rgba(79,142,247,.15);color:var(--accent);font-weight:600;padding:6px 10px;text-align:left;border-bottom:1px solid var(--border);}
    .bubble td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.04);}
    .bubble tr:last-child td{border-bottom:none;}
    .bubble tr:hover td{background:rgba(255,255,255,.03);}
    .typing{display:flex;align-items:center;gap:4px;padding:14px 16px;}
    .typing span{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.4;animation:blink 1.2s infinite;}
    .typing span:nth-child(2){animation-delay:.2s;}
    .typing span:nth-child(3){animation-delay:.4s;}
    @keyframes blink{0%,80%,100%{opacity:.4}40%{opacity:1}}
    .input-area{padding:16px 28px 20px;border-top:1px solid var(--border);background:var(--bg-base);position:relative;}
    .input-wrapper{display:flex;align-items:flex-end;gap:10px;background:var(--bg-input);border:1px solid var(--border);border-radius:14px;padding:10px 14px;transition:border-color .15s;}
    .input-wrapper:focus-within{border-color:var(--accent);}
    .chat-input{flex:1;background:transparent;border:none;outline:none;color:var(--text-main);font-size:14px;resize:none;line-height:1.5;max-height:120px;font-family:inherit;}
    .chat-input::placeholder{color:var(--text-muted);}
    .send-btn{width:36px;height:36px;border-radius:10px;flex-shrink:0;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;color:white;}
    .send-btn:hover{background:var(--accent-dim);}
    .send-btn:disabled{background:var(--bg-card);cursor:not-allowed;opacity:.5;}
    .input-hint{font-size:11px;color:var(--text-muted);margin-top:8px;text-align:center;}
    .mode-btn{width:34px;height:34px;border-radius:8px;flex-shrink:0;background:var(--bg-card);border:1px solid var(--border);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .mode-btn:hover{border-color:var(--accent);}
    .mode-btn.mode-btn-active{border-color:var(--accent);background:rgba(187,213,49,.12);}
    .mode-popup{position:absolute;bottom:calc(100% + 8px);left:0;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px;z-index:100;box-shadow:var(--shadow);min-width:260px;}
    .mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
    .mode-option{display:flex;flex-direction:column;align-items:center;padding:10px 6px;border-radius:10px;cursor:pointer;background:var(--bg-input);border:1px solid transparent;transition:all .15s;color:var(--text-dim);}
    .mode-option:hover{border-color:var(--border);color:var(--text-main);}
    .mode-option.mode-option-active{border-color:var(--accent);color:var(--text-main);background:rgba(187,213,49,.1);}
    .mode-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(187,213,49,.1);border:1px solid rgba(187,213,49,.3);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--accent);margin-bottom:8px;}
    .mode-badge-close{background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:14px;line-height:1;padding:0;margin-left:2px;}
    .mode-badge-close:hover{color:var(--text-main);}
    .audio-btn{width:34px;height:34px;border-radius:8px;flex-shrink:0;background:var(--bg-card);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;position:relative;outline:none;}
    .audio-btn:hover{border-color:var(--accent);}
    .audio-btn.recording{background:rgba(239,68,68,.15);border-color:#ef4444;animation:recPulse 1s ease-in-out infinite;}
    .audio-btn.transcribing{background:rgba(79,142,247,.12);border-color:#4f8ef7;cursor:not-allowed;}
    @keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}
    .audio-btn.recording svg{color:#ef4444;}
    .audio-btn.transcribing svg{color:#4f8ef7;animation:spin .8s linear infinite;}
    .audio-toast{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1a1d27;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--text-muted);white-space:nowrap;pointer-events:none;z-index:10;}
    .battery-bar-track{background:var(--border);border-radius:6px;height:10px;overflow:hidden;flex:1;}
    .battery-bar-fill{height:100%;border-radius:6px;transition:width .6s ease;}
    .map-container{height:200px;border-radius:10px;margin-top:10px;overflow:hidden;}
    .leaflet-container{font-family:inherit!important;font-size:13px!important;}
    .action-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
    .csv-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(187,213,49,.12);border:1px solid rgba(187,213,49,.35);color:var(--accent);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;}
    .csv-btn:hover{background:rgba(187,213,49,.22);border-color:var(--accent);}
    .informe-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(79,142,247,.12);border:1px solid rgba(79,142,247,.35);color:#4f8ef7;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;}
    .informe-btn:hover{background:rgba(79,142,247,.22);border-color:#4f8ef7;}
    .modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;width:92vw;max-width:960px;height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.6);animation:slideUp .25s ease;overflow:hidden;}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:64px;}
    .modal-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .modal-header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .modal-action-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;border:none;transition:all .15s;}
    .btn-download{background:rgba(187,213,49,.15);color:var(--accent);border:1px solid rgba(187,213,49,.3)!important;}
    .btn-download:hover{background:rgba(187,213,49,.25);}
    .btn-newtab{background:rgba(79,142,247,.15);color:#4f8ef7;border:1px solid rgba(79,142,247,.3)!important;}
    .btn-newtab:hover{background:rgba(79,142,247,.25);}
    .btn-close{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2)!important;width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;font-size:18px;}
    .btn-close:hover{background:rgba(239,68,68,.2);}
    .modal-body{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;}
    .modal-loading{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg-card);border-radius:0 0 20px 20px;min-height:400px;}
    .modal-loading-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .modal-loading p{font-size:13px;color:var(--text-muted);}
    .modal-loading small{font-size:11px;color:var(--text-dim);margin-top:-8px;}
    .login-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#0a0c10;overflow:hidden;}
    .login-bg{position:absolute;inset:0;overflow:hidden;}
    .login-bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(187,213,49,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(187,213,49,.04) 1px,transparent 1px);background-size:40px 40px;}
    .login-bg-glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(187,213,49,.08) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);animation:glowPulse 4s ease-in-out infinite;}
    @keyframes glowPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
    .login-card{position:relative;z-index:1;width:420px;max-width:92vw;background:rgba(26,29,39,.95);border:1px solid rgba(187,213,49,.15);border-radius:24px;padding:44px 40px 36px;box-shadow:0 0 0 1px rgba(187,213,49,.05),0 32px 64px rgba(0,0,0,.6);backdrop-filter:blur(20px);animation:loginIn .5s cubic-bezier(.34,1.56,.64,1);}
    @keyframes loginIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    .login-logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:36px;}
    .login-logo-img{height:64px;width:auto;object-fit:contain;filter:drop-shadow(0 0 20px rgba(187,213,49,.3));}
    .login-tagline{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(187,213,49,.6);margin-top:10px;font-family:'Courier New',monospace;}
    .login-field{margin-bottom:18px;}
    .login-label{display:block;font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
    .login-input{width:100%;background:rgba(13,15,20,.8);border:1px solid var(--border);color:var(--text-main);border-radius:10px;padding:12px 16px;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit;}
    .login-input:focus{border-color:rgba(187,213,49,.5);box-shadow:0 0 0 3px rgba(187,213,49,.08);}
    .login-input::placeholder{color:var(--text-muted);}
    .login-btn{width:100%;margin-top:8px;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#0d0f14;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:all .2s;}
    .login-btn:hover{background:#cce440;transform:translateY(-1px);box-shadow:0 8px 24px rgba(187,213,49,.25);}
    .login-btn:active{transform:translateY(0);}
    .login-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .login-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:10px 14px;font-size:13px;color:#f87171;margin-top:16px;text-align:center;animation:shake .3s ease;}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .login-footer{text-align:center;margin-top:20px;font-size:11px;color:var(--text-muted);}
    .login-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;animation:pulse 2s infinite;}
    .hint-clickable{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;font-style:italic;cursor:pointer;padding:4px 10px;border-radius:6px;border:1px solid rgba(187,213,49,0.2);background:rgba(187,213,49,0.05);transition:all .18s;user-select:none;text-decoration:none;}
    .hint-clickable:hover{background:rgba(187,213,49,0.14);border-color:rgba(187,213,49,0.45);transform:translateY(-1px);box-shadow:0 3px 10px rgba(187,213,49,0.12);}
    .hint-clickable:active{transform:translateY(0);}
    .hint-clickable .hint-icon{font-style:normal;font-size:14px;}
    @media(max-width:640px){.sidebar{display:none;}.messages-area{padding:16px;}.input-area{padding:12px 16px 16px;}.modal-box{width:98vw;height:96vh;border-radius:14px;}}
  </style>
</head>

function detectarTipoInforme(msg) {
  if (!msg || msg.role !== "bot") return "ninguno";
  if (msg.map) return "dispositivo";
  if (msg.html) {
    const h = msg.html;
    const esDetalle = h.includes("Serial:") && h.includes("Estado:") && h.includes("Batería:") && !h.includes("<tr><td>#</td>");
    if (esDetalle) return "dispositivo";
    if (h.includes("<table")) return "flota";
  }
  return "ninguno";
}

function parsearMetricasFlota(html, informeData) {
  if (informeData && informeData.tipo === 'flota' && informeData.kpis) {
    return { total:informeData.kpis.total, online:informeData.kpis.online, offline:informeData.kpis.offline, modelos:informeData.kpis.modelos, modelosArr:informeData.modelosArr||[], textoPlano:"" };
  }
  const parser = new DOMParser();
  const doc = parser.parseFromString(html || "","text/html");
  const texto = doc.body.innerText || doc.body.textContent || "";
  const onlineMatch  = texto.match(/(?:🟢|En línea|Conectados?|Encendidos?)[\s:·]*(\d+)/i);
  const offlineMatch = texto.match(/(?:🔴|Desconectados?|Apagados?)[\s:·]*(\d+)/i);
  const totalMatch   = texto.match(/Total[^\d]*(\d+)/i);
  return { total:totalMatch?parseInt(totalMatch[1]):null, online:onlineMatch?parseInt(onlineMatch[1]):null, offline:offlineMatch?parseInt(offlineMatch[1]):null, modelos:null, modelosArr:[], textoPlano:texto.slice(0,3000) };
}

function generarSvgBarrasModelos(modelosArr, titulo) {
  if (!modelosArr || modelosArr.length === 0) return "";
  const items=modelosArr.slice(0,15), barH=32, gap=14, labelW=120, chartW=520;
  const padT=36, padB=20, extraR=100;
  const svgW=labelW+chartW+extraR, svgH=padT+items.length*(barH+gap)+padB;
  const maxVal=Math.max(...items.map(m=>m.total),1);
  const C_ON="#22c55e", C_OFF="#ef4444", C_ON2="#16a34a", C_OFF2="#b91c1c";
  const MIN_INSIDE=36, MIN_BAR=4;
  let defs="", bars="";
  items.forEach((m,i)=>{
    const y=padT+i*(barH+gap), wTotal=Math.max(Math.round((m.total/maxVal)*chartW),MIN_BAR);
    const wOn=m.total>0?Math.round((m.on/m.total)*wTotal):0, wOff=wTotal-wOn;
    const x0=labelW, pct=m.total>0?Math.round((m.on/m.total)*100):0, cy=y+barH/2+4.5;
    defs+=`<linearGradient id="g_on_${i}" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${C_ON2}"/><stop offset="100%" stop-color="${C_ON}"/></linearGradient>`;
    defs+=`<linearGradient id="g_off_${i}" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${C_OFF2}"/><stop offset="100%" stop-color="${C_OFF}"/></linearGradient>`;
    bars+=`<rect x="${x0}" y="${y}" width="${chartW}" height="${barH}" rx="6" fill="#f1f5f9"/>`;
    if(wOn>=MIN_BAR){const r=6,noOff=wOff<MIN_BAR;if(noOff)bars+=`<rect x="${x0}" y="${y}" width="${wOn}" height="${barH}" rx="${r}" fill="url(#g_on_${i})"/>`;else{const x2=x0+wOn,y2=y+barH;bars+=`<path d="M${x0+r},${y} H${x2} V${y2} H${x0+r} Q${x0},${y2} ${x0},${y2-r} V${y+r} Q${x0},${y} ${x0+r},${y} Z" fill="url(#g_on_${i})"/>`;}if(wOn>=MIN_INSIDE)bars+=`<text x="${x0+wOn/2}" y="${cy}" text-anchor="middle" fill="white" font-size="11" font-weight="700" font-family="Inter,sans-serif">${m.on}</text>`;else bars+=`<text x="${x0+wOn/2}" y="${y-4}" text-anchor="middle" fill="${C_ON2}" font-size="10" font-weight="700" font-family="Inter,sans-serif">${m.on}</text>`;}
    if(wOff>=MIN_BAR){const xOff=x0+wOn,r=6,x2=xOff+wOff,y2=y+barH;bars+=`<path d="M${xOff},${y} H${x2-r} Q${x2},${y} ${x2},${y+r} V${y2-r} Q${x2},${y2} ${x2-r},${y2} H${xOff} Z" fill="url(#g_off_${i})"/>`;if(wOff>=MIN_INSIDE)bars+=`<text x="${xOff+wOff/2}" y="${cy}" text-anchor="middle" fill="white" font-size="11" font-weight="700" font-family="Inter,sans-serif">${m.off}</text>`;else{const lx=x2+6;bars+=`<line x1="${x2}" y1="${y+barH/2}" x2="${lx-1}" y2="${y+barH/2}" stroke="${C_OFF}" stroke-width="1" opacity="0.5"/><text x="${lx}" y="${cy}" text-anchor="start" fill="${C_OFF}" font-size="10" font-weight="700" font-family="Inter,sans-serif">${m.off}</text>`;}}
    const nombre=m.nombre.length>15?m.nombre.slice(0,14)+"…":m.nombre;
    bars+=`<text x="${labelW-8}" y="${cy}" text-anchor="end" fill="#374151" font-size="12" font-weight="600" font-family="Inter,sans-serif">${nombre}</text>`;
    const pctColor=pct>=70?C_ON:pct>=40?"#f59e0b":C_OFF;
    bars+=`<text x="${x0+chartW+10}" y="${cy}" fill="${pctColor}" font-size="11" font-weight="700" font-family="Inter,sans-serif">${pct}%</text>`;
  });
  return '<div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:24px;overflow-x:auto;">'
    +'<div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:16px;">'+titulo+'</div>'
    +'<svg viewBox="0 0 '+svgW+' '+svgH+'" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block;min-width:420px;">'
    +'<defs>'+defs+'</defs>'
    +'<text x="'+labelW+'" y="16" fill="#9ca3af" font-size="10" font-family="Inter,sans-serif" font-weight="600" letter-spacing="0.5">DISPOSITIVOS POR MODELO</text>'
    +bars+'</svg>'
    +'<div style="display:flex;gap:20px;margin-top:14px;flex-wrap:wrap;">'
    +'<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280;"><div style="width:12px;height:12px;border-radius:3px;background:'+C_ON+';"></div> Encendidos / En línea</div>'
    +'<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#6b7280;"><div style="width:12px;height:12px;border-radius:3px;background:'+C_OFF+';"></div> Apagados / Desconectados</div>'
    +'<div style="margin-left:auto;font-size:11px;color:#9ca3af;">% = conectividad por modelo</div>'
    +'</div></div>';
}

function parsearDatosDispositivo(msg) {
  if (msg.informe_data && msg.informe_data.tipo === 'dispositivo' && msg.informe_data.dispositivo) {
    const d = msg.informe_data.dispositivo;
    return {
      nombre:d.nombre||"Dispositivo", serial:d.serial||"N/D", modelo:d.modelo||"N/D",
      fabricante:d.fabricante||"", estado:d.estado||"Desconectado", bateria:d.bateria,
      negocio:d.negocio||"NUTRESA MOVILIDAD", ultimaConex:d.ultimaConex||"N/D",
      lat:d.lat, lng:d.lng,
      puntosGPS:msg.informe_data.puntosGPS||[], puntosBat:msg.informe_data.puntosBat||[],
      puntosRed:msg.informe_data.puntosRed||[], puntosTrafico:msg.informe_data.puntosTrafico||[],
      storage:msg.informe_data.storage||null,
    };
  }
  const bat = msg.battery || {};
  const parser = new DOMParser();
  const doc = msg.html ? parser.parseFromString(msg.html,"text/html") : null;
  const texto = doc ? (doc.body.innerText||doc.body.textContent||"") : "";
  const getField = label => { const m=texto.match(new RegExp(label+"[:\\s]+([^\\n]+)","i")); return m?m[1].trim():null; };
  let puntosGPS = [];
  if (msg.map&&msg.map.history&&msg.map.history.length>0) puntosGPS=msg.map.history;
  else if (msg.map) puntosGPS=[{lat:msg.map.lat,lng:msg.map.lng,fecha:"Último registro",num:1}];
  return {
    nombre:bat.name||getField("dispositivo")||"Dispositivo", serial:bat.serial||getField("serial")||"N/D",
    modelo:bat.model||getField("modelo")||"N/D", fabricante:getField("fabricante")||"",
    estado:getField("estado")||(bat.online_raw?"Conectado":"Desconectado"),
    bateria:bat.level!=null?bat.level:(parseInt(getField("batería"))||null),
    negocio:getField("negocio")||CLIENTE_CONFIG.nombre,
    ultimaConex:bat.lastSeen||getField("última conex")||"N/D",
    lat:msg.map?msg.map.lat:null, lng:msg.map?msg.map.lng:null,
    puntosGPS, puntosBat:[], puntosRed:[], puntosTrafico:[], storage:null,
  };
}

async function generarAnalisisIA(tipo, informeData) {
  const resp = await fetch(API_BASE+"/webhook/api/informe", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tipo, informe_data:informeData, cliente_nombre:CLIENTE_CONFIG?CLIENTE_CONFIG.nombre:''})
  });
  if (!resp.ok) throw new Error("HTTP "+resp.status+" al llamar /api/informe");
  const data = await resp.json();
  if (!data.analisis) throw new Error("El servidor no devolvió análisis");
  return data.analisis;
}

function descargarHtml(htmlContent, filename) {
  const blob=new Blob([htmlContent],{type:"text/html;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function downloadCSV(html, filename) {
  const parser=new DOMParser(), doc=parser.parseFromString(html,"text/html");
  const tables=doc.querySelectorAll("table");
  if (!tables.length) return;
  let csv="\uFEFF";
  tables.forEach((table,tIdx)=>{
    const titulo=table.querySelector("th[colspan]");
    if(titulo) csv+='"'+(titulo.textContent||"").replace(/"/g,'""').trim()+'"\n';
    table.querySelectorAll("tr").forEach(row=>{
      if((row.textContent||"").includes("💡")) return;
      if(row.querySelector("th[colspan]")) return;
      const vals=Array.from(row.querySelectorAll("th,td")).map(c=>'"'+(c.textContent||"").trim().replace(/\n/g," ").replace(/"/g,'""')+'"');
      if(vals.length) csv+=vals.join(",")+"\n";
    });
    if(tIdx<tables.length-1) csv+="\n";
  });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

// MODAL — usa Blob URL para el iframe (fix file://)
// ════════════════════════════════════════════════════════════════════
function InformeModal({ msg, onClose }) {
  var tipoInforme = detectarTipoInforme(msg);
  var [fase, setFase]               = useState("init");
  var [informeHtml, setInformeHtml] = useState("");
  var [errorMsg, setErrorMsg]       = useState("");
  var [blobUrl, setBlobUrl]         = useState(null);
  var iframeRef    = useRef(null);
  var blobUrlRef   = useRef(null);
  var isDispositivo = tipoInforme === "dispositivo";
  var serial = isDispositivo ? parsearDatosDispositivo(msg).serial : "";
  var nombreArchivo = isDispositivo
    ? "Informe_Dispositivo_"+serial+"_"+new Date().toISOString().slice(0,10)+".html"
    : "Informe_Flota_"+new Date().toISOString().slice(0,10)+".html";

  useEffect(function(){ lanzarGeneracion(); }, []);

  // Revoca el blob URL anterior cuando se actualiza
  useEffect(function(){
    if (blobUrl) {
      if (iframeRef.current) iframeRef.current.src = blobUrl;
      blobUrlRef.current = blobUrl;
    }
  }, [blobUrl]);

  // Limpieza al desmontar
  useEffect(function(){
    return function(){ if(blobUrlRef.current) URL.revokeObjectURL(blobUrlRef.current); };
  }, []);

  function mostrarEnIframe(html) {
    if (blobUrlRef.current) URL.revokeObjectURL(blobUrlRef.current);
    var blob = new Blob([html], {type:"text/html;charset=utf-8"});
    var url  = URL.createObjectURL(blob);
    setBlobUrl(url);
  }

  async function lanzarGeneracion() {
    setFase("loading");
    try {
      var iData = msg.informe_data || null;
      var final = "";
      if (isDispositivo) {
        var datos    = parsearDatosDispositivo(msg);
        var analisis = await generarAnalisisIA("dispositivo", iData);
        final = generarInformeDispositivo(datos, msg.html||"", analisis);
      } else {
        var analisis2 = await generarAnalisisIA("flota", iData);
        final = generarInformeFlota(msg.html, analisis2, iData);
      }
      setInformeHtml(final);
      mostrarEnIframe(final);
      setFase("listo");
    } catch(err) {
      console.error(err);
      setErrorMsg(err.message);
      setFase("error");
    }
  }

  function abrirEnPestana() {
    if (informeHtml) {
      var win = window.open("","_blank");
      if (win) { win.document.write(informeHtml); win.document.close(); }
    }
  }

  function generarSinIA() {
    var iData = msg.informe_data || null;
    var final = "";
    if (isDispositivo) {
      var datos = parsearDatosDispositivo(msg);
      final = generarInformeDispositivo(datos, msg.html||"", "");
    } else {
      final = generarInformeFlota(msg.html, "", iData);
    }
    setInformeHtml(final);
    mostrarEnIframe(final);
    setFase("listo");
  }

  var tipoLabel = isDispositivo ? "📱 Dispositivo"+(serial?" · "+serial:"") : "📊 Flota";

  return (
    <div className="modal-overlay" onClick={function(e){ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-box">
        <div className="modal-header">
          <div className="modal-title">
            <span style={{fontSize:"18px"}}>📄</span> Informe Técnico
            <span style={{fontSize:"11px",background:"rgba(79,142,247,.15)",color:"#4f8ef7",border:"1px solid rgba(79,142,247,.3)",borderRadius:"20px",padding:"2px 10px",fontWeight:600}}>{tipoLabel}</span>
            {fase==="listo" && <span style={{fontSize:"11px",background:"rgba(187,213,49,.15)",color:"var(--accent)",border:"1px solid rgba(187,213,49,.3)",borderRadius:"20px",padding:"2px 10px",fontWeight:600}}>✓ Listo</span>}
          </div>
          <div className="modal-header-actions">
            {fase==="listo" && <>
              <button className="modal-action-btn btn-download" onClick={function(){ descargarHtml(informeHtml, nombreArchivo); }}>⬇️ Descargar HTML</button>
              <button className="modal-action-btn btn-newtab"   onClick={abrirEnPestana}>🔗 Abrir en pestaña</button>
            </>}
            <button className="btn-close" onClick={onClose}>×</button>
          </div>
        </div>
        <div className="modal-body">
          {fase==="loading" && (
            <div className="modal-loading">
              <div className="modal-loading-spinner"/>
              <p>Generando informe {isDispositivo?"de dispositivo":"de flota"}…</p>
              <small>Analizando datos con IA</small>
            </div>
          )}
          {fase==="error" && (
            <div className="modal-loading">
              <div style={{fontSize:"36px"}}>⚠️</div>
              <p style={{color:"#ef4444",fontWeight:600}}>Error al generar análisis IA</p>
              <p style={{fontSize:"12px",color:"var(--text-muted)",maxWidth:"320px",textAlign:"center"}}>{errorMsg}</p>
              <div style={{display:"flex",gap:"10px",marginTop:"8px"}}>
                <button className="modal-action-btn btn-newtab" onClick={function(){setFase("loading");lanzarGeneracion();}}>🔄 Reintentar</button>
                <button className="modal-action-btn btn-download" onClick={generarSinIA}>📄 Informe sin IA</button>
              </div>
            </div>
          )}
          {fase==="listo" && (
            <iframe ref={iframeRef} className="modal-iframe" title="Informe Técnico"
              style={{flex:1,width:"100%",height:"100%",minHeight:0,border:"none",display:"block",borderBottomLeftRadius:"20px",borderBottomRightRadius:"20px"}}
            />
          )}
        </div>
      </div>
    </div>
  );
}

// MESSAGE BUBBLE

function MessageBubble({ msg, onSendMessage }) {
  var isUser         = msg.role === "user";
  var tieneTabla     = msg.html && msg.html.includes("<table");
  var tipoInforme    = detectarTipoInforme(msg);
  var muestraInforme = tipoInforme !== "ninguno";
  var nombreCSV      = "SOTI_"+new Date().toISOString().slice(0,10)+".csv";
  var [showInforme, setShowInforme] = useState(false);

  return (
    <>
      <div className={"msg-row"+(isUser?" user":"")}>
        <div className={"msg-avatar"+(isUser?" user-av":" bot-av")}>{isUser?USER_AVATAR:BOT_AVATAR}</div>
        <div className={"bubble"+(isUser?" user-bubble":" bot-bubble")}>
          {msg.html && <div
            dangerouslySetInnerHTML={{__html:msg.html}}
            onClick={function(e){
              var el=e.target.closest('.hint-clickable');
              if(el&&onSendMessage){var query=el.dataset.query,mode=el.dataset.mode||undefined;if(query)onSendMessage(query,mode);}
            }}
          />}
          {!msg.html && !msg.battery && <div dangerouslySetInnerHTML={{__html:escapeHtml(msg.content)}}/>}
          {msg.battery && !msg.html && <BatteryBar level={msg.battery.level} name={msg.battery.name} model={msg.battery.model} lastSeen={msg.battery.lastSeen} serial={msg.battery.serial} online_raw={msg.battery.online_raw} estado={msg.battery.estado}/>}
          {msg.informe_data && msg.informe_data.storage && !msg.html && <StorageBar totalGB={msg.informe_data.storage.totalGB} usadoGB={msg.informe_data.storage.usadoGB} dispGB={msg.informe_data.storage.dispGB} pct={msg.informe_data.storage.pct}/>}
          {msg.map && <MapMessage lat={msg.map.lat} lng={msg.map.lng} name={msg.map.name} history={msg.map.history}/>}
          {(tieneTabla||muestraInforme) && (
            <div className="action-btns">
              {tieneTabla && <button className="csv-btn" onClick={function(){downloadCSV(msg.html,nombreCSV);}}>⬇️ Descargar CSV</button>}
              {muestraInforme && <button className="informe-btn" onClick={function(){setShowInforme(true);}}>📄 Generar Informe</button>}
            </div>
          )}
          <div className="bubble-time">{formatTime(msg.time)}</div>
        </div>
      </div>
      {showInforme && <InformeModal msg={msg} onClose={function(){setShowInforme(false);}}/>}
    </>
  );
}

function MapMessage({ lat, lng, name, history }) {
  var containerRef=useRef(null), mapRef=useRef(null);
  var googleMapsUrl="https://www.google.com/maps?q="+lat+","+lng;
  useEffect(function(){
    if(!containerRef.current||typeof L==="undefined") return;
    if(mapRef.current){mapRef.current.remove();mapRef.current=null;}
    var puntos=history&&history.length>0?history:[{lat:lat,lng:lng,fecha:"",num:1}];
    var map=L.map(containerRef.current,{zoomControl:true}).setView([puntos[0].lat,puntos[0].lng],15);
    L.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",{attribution:"© Google Maps",maxZoom:20}).addTo(map);
    if(puntos.length>1){var ll=puntos.map(function(p){return[p.lat,p.lng];});L.polyline(ll,{color:"#bbd531",weight:2,opacity:.6,dashArray:"5,5"}).addTo(map);L.polyline(ll,{color:"#ef4444",weight:3,opacity:.8,dashArray:"6,4"}).addTo(map);}
    var iU=L.divIcon({className:"",html:'<div style="background:#bbd531;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(187,213,49,.8);"></div>',iconSize:[14,14],iconAnchor:[7,7]});
    var iN=L.divIcon({className:"",html:'<div style="background:#4f8ef7;width:9px;height:9px;border-radius:50%;border:1px solid #fff;opacity:.8;"></div>',iconSize:[9,9],iconAnchor:[4,4]});
    puntos.forEach(function(p,idx){var esU=idx===0;var m=L.marker([p.lat,p.lng],{icon:esU?iU:iN}).addTo(map);m.bindPopup("<b>"+(esU?"🟢 Último punto":"Punto "+p.num)+"</b><br>📅 "+p.fecha+"<br>📍 "+p.lat.toFixed(6)+", "+p.lng.toFixed(6)+"<br><a href='https://www.google.com/maps?q="+p.lat+","+p.lng+"' target='_blank' style='color:#4285F4;'>Ver en Google Maps</a>");if(esU)m.openPopup();});
    if(puntos.length>1){var b=L.latLngBounds(puntos.map(function(p){return[p.lat,p.lng];}));map.fitBounds(b,{padding:[30,30]});}
    mapRef.current=map;
    return function(){if(mapRef.current){mapRef.current.remove();mapRef.current=null;}};
  },[lat,lng,name,history]);
  return (
    <div>
      <div ref={containerRef} className="map-container" style={{height:"300px"}}/>
      <a href={googleMapsUrl} target="_blank" rel="noopener noreferrer"
        style={{display:"inline-block",marginTop:"8px",padding:"6px 14px",background:"#4285F4",color:"#fff",borderRadius:"6px",textDecoration:"none",fontSize:"12px"}}>
        🗺️ Abrir último punto en Google Maps
      </a>
    </div>
  );
}

// AUDIO BUTTON
// ════════════════════════════════════════════════════════════════════
function AudioButton({ onTranscript, disabled }) {
  var [status, setStatus] = useState("idle");
  var [toast, setToast]   = useState("");
  var mediaRecRef = useRef(null), chunksRef = useRef([]), timerRef = useRef(null);

  var showToast = function(msg, ms) {
    ms=ms||2500; setToast(msg);
    clearTimeout(timerRef.current);
    timerRef.current=setTimeout(function(){setToast("");},ms);
  };

  var startRecording = async function() {
    try {
      var stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunksRef.current=[];
      var mimeType=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":"audio/webm";
      var rec=new MediaRecorder(stream,{mimeType:mimeType});
      rec.ondataavailable=function(e){if(e.data.size>0)chunksRef.current.push(e.data);};
      rec.onstop=function(){stream.getTracks().forEach(function(t){t.stop();});var blob=new Blob(chunksRef.current,{type:mimeType});sendToWhisper(blob,mimeType);};
      rec.start(200); mediaRecRef.current=rec; setStatus("recording");
      showToast("🔴 Grabando… toca de nuevo para enviar",60000);
    } catch(err){ showToast("⚠️ Sin acceso al micrófono"); }
  };

  var stopRecording = function() {
    if(mediaRecRef.current&&mediaRecRef.current.state!=="inactive"){
      mediaRecRef.current.stop(); setStatus("transcribing"); showToast("⏳ Transcribiendo…",15000);
    }
  };

  var sendToWhisper = async function(blob, mimeType) {
    var ext=mimeType.includes("mp4")?"m4a":"webm";
    var formData=new FormData(); formData.append("audio",blob,"voice."+ext);
    try {
      var res=await fetch(API_BASE+"/webhook/api/transcribe",{method:"POST",body:formData});
      if(!res.ok) throw new Error("HTTP "+res.status);
      var raw=await res.text();
      if(!raw||!raw.trim()){showToast("⚠️ Sin respuesta");return;}
      var data; try{data=JSON.parse(raw);}catch(e){showToast("⚠️ Respuesta inválida");return;}
      var text=(data.text||"").trim();
      if(text) onTranscript(text); else showToast("⚠️ No se detectó voz");
    } catch(err){ showToast("⚠️ "+err.message); }
    finally{ setStatus("idle"); }
  };

  var handleClick = function() {
    if(status==="idle") startRecording();
    else if(status==="recording") stopRecording();
  };

  var micIcon=(
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <rect x="9" y="2" width="6" height="11" rx="3"/>
      <path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>
    </svg>
  );
  var stopIcon=<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>;
  var spinIcon=<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round"><path d="M12 2a10 10 0 0 1 10 10"/></svg>;

  return (
    <div style={{position:"relative",flexShrink:0}}>
      <button className={"audio-btn "+(status)} onClick={handleClick} disabled={disabled||status==="transcribing"}
        title={status==="idle"?"Grabar voz":status==="recording"?"Detener grabación":"Transcribiendo…"}>
        {status==="recording"?stopIcon:status==="transcribing"?spinIcon:micIcon}
      </button>
      {toast && <div className="audio-toast">{toast}</div>}
    </div>
  );
}

function ModeSelector({ activeMode, onSelect }) {
  var [open,setOpen]=useState(false), wrapRef=useRef(null);
  useEffect(function(){
    var h=function(e){if(wrapRef.current&&!wrapRef.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",h); return function(){document.removeEventListener("mousedown",h);};
  },[]);
  var current=MODES.find(function(m){return m.id===activeMode;})||MODES[0];
  return (
    <div style={{position:"relative"}} ref={wrapRef}>
      <button className={"mode-btn"+(activeMode!=="free"?" mode-btn-active":"")} onClick={function(){setOpen(function(o){return !o;});}} title="Seleccionar agente">{current.icon}</button>
      {open && (
        <div className="mode-popup">
          <p style={{fontSize:"11px",fontWeight:600,letterSpacing:".6px",textTransform:"uppercase",color:"var(--text-muted)",marginBottom:"10px"}}>Seleccionar agente</p>
          <div className="mode-grid">
            {MODES.map(function(m){return (
              <button key={m.id} className={"mode-option"+(activeMode===m.id?" mode-option-active":"")} onClick={function(){onSelect(m.id);setOpen(false);}}>
                <span style={{fontSize:"22px"}}>{m.icon}</span><span style={{fontSize:"11px",marginTop:"4px"}}>{m.label}</span>
              </button>
            );})}
          </div>
        </div>
      )}
    </div>
  );
}

function getSession() { try{return JSON.parse(sessionStorage.getItem(STORAGE_SESSION)||'null');}catch{return null;} }
function saveSession(user) { sessionStorage.setItem(STORAGE_SESSION,JSON.stringify(user)); }
function clearSession() { sessionStorage.removeItem(STORAGE_SESSION); }

function LoginScreen({ onLogin }) {
  var [usuario,setUsuario]=useState(""), [password,setPassword]=useState(""), [error,setError]=useState(""), [loading,setLoading]=useState(false);
  var passRef=useRef(null);
  var handleLogin=function(e){
    e&&e.preventDefault(); setLoading(true); setError("");
    setTimeout(function(){
      var found=USUARIOS.find(function(u){return u.usuario.toLowerCase()===usuario.trim().toLowerCase()&&u.password===password;});
      if(found){saveSession(found);window.location.reload();}
      else{setError("Usuario o contraseña incorrectos");setLoading(false);}
    },600);
  };
  return (
    <div className="login-overlay">
      <div className="login-bg"><div className="login-bg-grid"/><div className="login-bg-glow"/></div>
      <div className="login-card">
        <div className="login-logo-wrap">
          <img src="https://b2kmnbrlfbl9jvgp.public.blob.vercel-storage.com/sofIAlogo.jpg" alt="SofIA" className="login-logo-img"/>
          <span className="login-tagline">Asistente SOTI · Compunet</span>
        </div>
        <form onSubmit={handleLogin}>
          <div className="login-field">
            <label className="login-label">Usuario</label>
            <input className="login-input" type="text" placeholder="Tu usuario" value={usuario} autoComplete="username" autoFocus
              onChange={function(e){setUsuario(e.target.value);}} onKeyDown={function(e){if(e.key==="Enter"&&passRef.current)passRef.current.focus();}}/>
          </div>
          <div className="login-field">
            <label className="login-label">Contraseña</label>
            <input ref={passRef} className="login-input" type="password" placeholder="••••••••" value={password} autoComplete="current-password"
              onChange={function(e){setPassword(e.target.value);}}/>
          </div>
          <button className="login-btn" type="submit" disabled={loading||!usuario||!password}>{loading?"Verificando…":"Ingresar →"}</button>
        </form>
        {error && <div className="login-error">⚠️ {error}</div>}
        <div className="login-footer"><span className="login-dot"/>SofIA — Sistema seguro</div>
      </div>
    </div>
  );
}

function transformarHints(htmlStr) {
  if(!htmlStr) return htmlStr;
  return htmlStr.replace(/💡\s*(Para ver[^<]*:?\s*)<i>"([^"]+)"<\/i>/g,function(match,prefix,query){
    var escaped=query.replace(/"/g,'&quot;');
    return '<span class="hint-clickable" data-query="'+escaped+'" data-mode="inventory"><span class="hint-icon">💡</span>'+prefix+'<b>'+query+'</b></span>';
  });
}

// ════════════════════════════════════════════════════════════════════
// APP
// ════════════════════════════════════════════════════════════════════
function App() {
  var [currentUser,setCurrentUser]=useState(function(){
    var session=getSession();
    if(session) CLIENTE_CONFIG=session.cliente;
    return session;
  });
  var [sessions,setSessions]       = useState(function(){return loadSessions();});
  var [activeChatId,setActiveChatId] = useState(null);
  var [messages,setMessages]       = useState([]);
  var [input,setInput]             = useState("");
  var [loading,setLoading]         = useState(false);
  var [activeMode,setActiveMode]   = useState("free");
  var bottomRef=useRef(null), textareaRef=useRef(null);
  var activeChatIdRef=useRef(null), activeModeRef=useRef("free");

  var handleLogout=function(){clearSession();CLIENTE_CONFIG=null;window.location.reload();};

  if(!currentUser) return <LoginScreen onLogin={function(){}}/>;

  var handleTranscript=useCallback(function(text){sendMessage(text);},[]);

  useEffect(function(){activeChatIdRef.current=activeChatId;},[activeChatId]);
  useEffect(function(){activeModeRef.current=activeMode;},[activeMode]);
  useEffect(function(){saveSessions(sessions);},[sessions]);
  useEffect(function(){if(bottomRef.current)bottomRef.current.scrollIntoView({behavior:"smooth"});},[messages,loading]);

  var startNewChat=function(){setMessages([]);setActiveChatId(null);};
  var loadChat=function(s){setMessages(s.messages.map(function(m){return Object.assign({},m,{time:new Date(m.time)});}));setActiveChatId(s.id);};
  var deleteChat=function(e,id){e.stopPropagation();setSessions(function(p){return p.filter(function(s){return s.id!==id;});});if(activeChatIdRef.current===id){setMessages([]);setActiveChatId(null);}};

  var sendMessage=useCallback(async function(text,modeOverride){
    var rawContent=(text||input).trim();
    if(!rawContent||loading) return;
    var mode=modeOverride||activeModeRef.current;
    var currentMode=MODES.find(function(m){return m.id===mode;})||MODES[0];
    var apiMessage=rawContent;
    if(mode==="location") apiMessage="ubicación serial: "+rawContent;
    else if(mode==="battery") apiMessage="batería serial: "+rawContent;
    else if(mode==="inventory"&&!rawContent.toLowerCase().startsWith("lista")) apiMessage="lista dispositivos "+rawContent;
    var prefix=currentMode.id!=="free"?currentMode.icon+" ":"";
    var userMsg={role:"user",content:prefix+rawContent,html:null,time:new Date()};
    setMessages(function(p){return p.concat([userMsg]);}); setInput(""); setLoading(true);
    if(textareaRef.current) textareaRef.current.style.height="auto";
    var botMsg;
    try {
      var history=messages
        .filter(function(m){var c=m.content||"";return !m.isError&&!c.includes("⚠️")&&!c.includes("Error al conectar")&&c.trim()!=="";})
        .slice(-6)
        .map(function(m){return {role:m.role==="bot"?"assistant":"user",content:m.content||(m.html?"[respuesta anterior]":"")};})
        .filter(function(m){return m.content.trim()!=="";});
      var res=await fetch(API_BASE+"/webhook/api/chat",{
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({message:apiMessage,history:history,mode:mode,
          cliente_path:CLIENTE_CONFIG.path,cliente_nombre:CLIENTE_CONFIG.nombre,
          cliente_negocios:CLIENTE_CONFIG.negocios,cliente_regionales:CLIENTE_CONFIG.regionales})
      });
      var raw=await res.text();
      if(!raw||!raw.trim()) throw new Error("El servidor respondió vacío (HTTP "+res.status+")");
      if(!res.ok) throw new Error("HTTP "+res.status+": "+raw.slice(0,200));
      var data; try{data=JSON.parse(raw);}catch(e){throw new Error("Respuesta no es JSON: "+raw.slice(0,200));}
      botMsg={role:"bot",content:data.text||"",html:transformarHints(data.html||null),map:data.map||null,battery:data.battery||null,informe_data:data.informe_data||null,isError:false,time:new Date()};
    } catch(err){
      botMsg={role:"bot",content:"⚠️ "+err.message,html:null,map:null,battery:null,isError:true,time:new Date()};
    }
    setMessages(function(prev){
      var updated=prev.concat([botMsg]);
      var currentId=activeChatIdRef.current;
      var title=rawContent.slice(0,45)+(rawContent.length>45?"…":"");
      if(!botMsg.isError){
        setSessions(function(ps){
          if(currentId) return ps.map(function(s){return s.id===currentId?Object.assign({},s,{messages:updated,updatedAt:Date.now()}):s;});
          var newId=genId(); activeChatIdRef.current=newId; setActiveChatId(newId);
          return [{id:newId,title:title,messages:updated,updatedAt:Date.now()}].concat(ps);
        });
      }
      return updated;
    });
    setLoading(false);
  },[input,loading,messages]);

  var handleModeSelect=function(modeId){setActiveMode(modeId);var m=MODES.find(function(x){return x.id===modeId;});if(m&&m.autoQuery)sendMessage(m.autoQuery,modeId);};
  var handleKey=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}};
  var handleTextarea=function(e){setInput(e.target.value);e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px";};

  var isEmpty=messages.length===0;
  var currentMode=MODES.find(function(m){return m.id===activeMode;})||MODES[0];
  var placeholder=activeMode!=="free"?currentMode.hint:"Escribe tu consulta… (Enter enviar, Shift+Enter nueva línea)";
  var logoCliente=getLogoCliente(currentUser&&currentUser.usuario);
  var nombreCliente=currentUser&&currentUser.cliente?currentUser.cliente.nombre:"SofIA";

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-logo"><img src="https://b2kmnbrlfbl9jvgp.public.blob.vercel-storage.com/sofIAlogo.jpg" alt="sofIA" className="logo-img"/></div>
        <button className="new-chat-btn" onClick={startNewChat}><span>&#xFF0B;</span> Nueva consulta</button>
        <div><p className="sidebar-section-title">Recientes</p></div>
        <div className="chat-history">
          {sessions.length===0&&<p style={{fontSize:"12px",color:"var(--text-muted)",padding:"8px 12px"}}>Sin conversaciones guardadas</p>}
          {sessions.map(function(s){return (
            <div key={s.id} className={"history-item"+(s.id===activeChatId?" active":"")} onClick={function(){loadChat(s);}}>
              <span className="history-item-text">💬 {s.title}</span>
              <button className="history-delete-btn" onClick={function(e){deleteChat(e,s.id);}} title="Eliminar">×</button>
            </div>
          );})}
        </div>
        <div className="sidebar-footer">
          <div className="avatar" style={{background:'#0d0f14',border:'1px solid '+currentUser.color+'55',padding:'2px',overflow:'hidden'}}>
            <img src={getLogoCliente(currentUser&&currentUser.usuario)} alt={currentUser.cliente.nombre} style={{width:'100%',height:'100%',objectFit:'contain',borderRadius:'50%',display:'block'}}/>
          </div>
          <div className="user-info">
            <div className="user-name">{currentUser.nombre}</div>
            <div className="user-role" style={{color:currentUser.color+'cc'}}>{currentUser.cliente.nombre}</div>
          </div>
          <button onClick={handleLogout} title="Cerrar sesión"
            style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-muted)',fontSize:'18px',lineHeight:1,padding:'4px',borderRadius:'6px',transition:'color .15s'}}
            onMouseEnter={function(e){e.target.style.color='#ef4444';}} onMouseLeave={function(e){e.target.style.color='var(--text-muted)';}}>⏏</button>
        </div>
      </aside>
      <main className="chat-main">
        <header className="chat-header">
          <div><div className="chat-header-title">Asistente SOTI</div><div className="chat-header-sub">Consultas en lenguaje natural</div></div>
          <div className="status-badge"><span className="status-dot"/> Conectado</div>
        </header>
        <div className="messages-area">
          {isEmpty?(
            <div className="welcome">
              <div className="welcome-icon"><img src={logoCliente} alt={nombreCliente} style={{width:"100%",height:"100%",objectFit:"contain",borderRadius:"20px"}}/></div>
              <h2>Hola, ¿en qué puedo ayudarte?</h2>
              <p>Soy tu asistente para consultar la base de datos GPS. Puedes preguntarme sobre dispositivos, ubicaciones y más.</p>
              <div className="suggestions">
                {SUGGESTIONS.map(function(s,i){return <button key={i} className="suggestion-chip" onClick={function(){sendMessage(s);}}>{s}</button>;})}
              </div>
            </div>
          ):messages.map(function(m,i){return <MessageBubble key={i} msg={m} onSendMessage={sendMessage}/>;})}
          {loading&&<TypingBubble/>}
          <div ref={bottomRef}/>
        </div>
        <div className="input-area">
          {activeMode!=="free"&&(
            <div style={{marginBottom:"8px"}}>
              <span className="mode-badge">{currentMode.icon} {currentMode.label}
                <button className="mode-badge-close" onClick={function(){setActiveMode("free");}} title="Volver al modo libre">×</button>
              </span>
            </div>
          )}
          <div className="input-wrapper">
            <ModeSelector activeMode={activeMode} onSelect={handleModeSelect}/>
            <AudioButton onTranscript={handleTranscript} disabled={loading}/>
            <textarea ref={textareaRef} className="chat-input" placeholder={placeholder} value={input}
              onChange={handleTextarea} onKeyDown={handleKey} rows={1}/>
            <button className="send-btn" onClick={function(){sendMessage();}} disabled={!input.trim()||loading} title="Enviar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
          <p className="input-hint">SofIA puede cometer errores. Verifica información crítica.</p>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
