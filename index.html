<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SofIA</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    // Fuerza el runtime "classic" a nivel de preset para evitar el error
    // "importSource cannot be set when runtime is classic" en versiones nuevas de Babel.
    Babel.registerPreset("app", {
      presets: [
        [Babel.availablePresets["env"], {}],
        [Babel.availablePresets["react"], { runtime: "classic" }]
      ]
    });
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" />

  <!-- Blobatar: núcleo vivo de SofIA (MIT · blobatar.dev) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/blobatar@2.7.0/dist/motion.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/blobatar@2.7.0/dist/gaze.css" />
  <script type="module">
    import { _parts } from "https://cdn.jsdelivr.net/npm/blobatar@2.7.0/dist/internal.js";
    import * as EXPR from "https://cdn.jsdelivr.net/npm/blobatar@2.7.0/dist/expression.js";
    import { gaze } from "https://cdn.jsdelivr.net/npm/blobatar@2.7.0/dist/gaze.js";
    window.BLOBATAR = { parts: _parts, expr: EXPR, gaze: gaze };
    window.dispatchEvent(new Event("blobatar-ready"));
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Superficies */
      --bg:#090b10; --bg-2:#0e1117; --bg-3:#141821;
      --surface:rgba(255,255,255,.035); --surface-2:rgba(255,255,255,.06); --surface-3:rgba(255,255,255,.09);
      --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
      /* Marca */
      --accent:#bbd531; --accent-2:#d4ec4a; --accent-ink:#0d0f14; --accent-soft:rgba(187,213,49,.12);
      --blue:#4f8ef7; --red:#ef4444; --amber:#f59e0b; --green:#22c55e;
      /* Texto */
      --text-main:#eef0f4; --text-dim:#a3a9b6; --text-muted:#6b7280;
      /* Color del modo activo (lo cambia React) */
      --mode:#bbd531;
      /* Motion */
      --ease-out:cubic-bezier(.22,1,.36,1);
      --ease-spring:cubic-bezier(.34,1.56,.64,1);
      --ease-io:cubic-bezier(.65,0,.35,1);
      --t-micro:160ms; --t-base:320ms; --t-hero:820ms;
      --radius:16px; --rail:76px; --rail-open:276px;
      --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
      --font-body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
      /* Alias de compatibilidad (estilos inline existentes) */
      --bg-base:var(--bg); --bg-card:var(--bg-3); --bg-input:var(--bg-3); --border:var(--line-2);
      --shadow:0 18px 50px rgba(0,0,0,.45);
      /* Respuestas (clases sf-* de n8n) */
      --sf-text:#eef0f4; --sf-muted:#8b93a1; --sf-line:rgba(255,255,255,.07); --sf-line2:rgba(255,255,255,.14);
      --sf-surface:rgba(255,255,255,.025); --sf-surface2:rgba(255,255,255,.05); --sf-head:rgba(255,255,255,.03); --sf-track:rgba(255,255,255,.07);
      --sf-bg:#0f1218; --sf-acc:#bbd531; --sf-acc-text:#c9e340; --sf-acc-soft:rgba(187,213,49,.1);
      --sf-on:#4ade80; --sf-off:#f87171; --sf-mid:#fbbf24; --sf-info:#60a5fa; --sf-display:var(--font-display);
    }
    html,body,#root{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text-main);-webkit-font-smoothing:antialiased;}
    button{font-family:inherit;}
    ::selection{background:rgba(187,213,49,.3);}
    .ico{width:18px;height:18px;flex-shrink:0;display:block;}

    /* ═══════════ FONDO VIVO ═══════════ */
    .app{display:flex;height:100vh;height:100dvh;overflow:hidden;position:relative;isolation:isolate;}
    .aurora{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
    .aurora::before,.aurora::after{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform;}
    .aurora::before{background:radial-gradient(circle,rgba(187,213,49,.16),transparent 60%);top:-30vmax;right:-20vmax;animation:drift1 26s ease-in-out infinite alternate;}
    .aurora::after{background:radial-gradient(circle,rgba(79,142,247,.12),transparent 60%);bottom:-35vmax;left:-15vmax;animation:drift2 32s ease-in-out infinite alternate;}
    .aurora-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 0%,transparent 70%);}
    @keyframes drift1{to{transform:translate(-12vmax,10vmax) scale(1.1)}}
    @keyframes drift2{to{transform:translate(14vmax,-8vmax) scale(.95)}}

    /* ═══════════ SIDEBAR · RIEL EXPANDIBLE ═══════════ */
    .sidebar-slot{width:var(--rail);flex-shrink:0;position:relative;z-index:40;}
    .sidebar{position:absolute;top:0;left:0;bottom:0;width:var(--rail);background:rgba(14,17,23,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:18px;overflow:hidden;transition:width var(--t-base) var(--ease-out),box-shadow var(--t-base) var(--ease-out);}
    .sidebar:hover,.sidebar:focus-within{width:var(--rail-open);box-shadow:24px 0 60px rgba(0,0,0,.45);}
    .sb-label{opacity:0;transform:translateX(-6px);transition:opacity 200ms var(--ease-out),transform 260ms var(--ease-out);white-space:nowrap;}
    .sidebar:hover .sb-label,.sidebar:focus-within .sb-label{opacity:1;transform:none;transition-delay:80ms;}
    .sidebar-logo{height:48px;display:flex;align-items:center;gap:12px;padding-left:2px;position:relative;}
    .sb-orb{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
    .logo-img{height:38px;width:auto;object-fit:contain;border-radius:8px;}
    .new-chat-btn{display:flex;align-items:center;gap:12px;height:46px;padding:0 13px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:14px;cursor:pointer;font-size:14px;font-weight:600;transition:transform var(--t-micro) var(--ease-out),box-shadow var(--t-base) var(--ease-out),background var(--t-micro);overflow:hidden;}
    .new-chat-btn:hover{background:var(--accent-2);box-shadow:0 8px 28px rgba(187,213,49,.28);}
    .new-chat-btn:active{transform:scale(.97);}
    .new-chat-btn .ico{transition:transform 420ms var(--ease-spring);}
    .new-chat-btn:hover .ico{transform:rotate(90deg);}
    .sidebar-section-title{font-size:10.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-muted);padding:0 14px;height:14px;}
    .chat-history{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;overflow-x:hidden;position:relative;margin:0 -4px;padding:0 4px;scrollbar-width:none;}
    .chat-history::-webkit-scrollbar{display:none;}
    .history-indicator{position:absolute;left:4px;right:4px;top:0;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2);transition:transform 420ms var(--ease-spring),height 300ms var(--ease-out),opacity 200ms;pointer-events:none;z-index:0;}
    .history-indicator::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 12px var(--accent);}
    .history-item{position:relative;z-index:1;height:40px;padding:0 12px 0 14px;border-radius:12px;cursor:pointer;font-size:13px;color:var(--text-dim);display:flex;align-items:center;gap:12px;transition:color var(--t-micro),background var(--t-micro);animation:itemIn 480ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 35ms);flex-shrink:0;}
    .history-item:hover{color:var(--text-main);background:var(--surface);}
    .history-item.active{color:var(--text-main);}
    .history-item .h-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1.5px solid currentColor;opacity:.7;margin:0 4px;transition:all var(--t-base) var(--ease-out);}
    .history-item.active .h-dot{background:var(--accent);border-color:var(--accent);opacity:1;box-shadow:0 0 10px var(--accent);}
    .history-item.leaving{animation:itemOut 300ms var(--ease-io) forwards;pointer-events:none;}
    @keyframes itemIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
    @keyframes itemOut{0%{opacity:1;height:40px}60%{opacity:0;transform:translateX(-24px) scale(.96);height:40px}100%{opacity:0;height:0;transform:translateX(-24px) scale(.96)}}
    .history-item-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .history-delete-btn{flex-shrink:0;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:var(--text-muted);border-radius:7px;opacity:0;transform:scale(.7);transition:all var(--t-micro) var(--ease-out);}
    .history-item:hover .history-delete-btn{opacity:1;transform:none;}
    .history-delete-btn:hover{color:var(--red);background:rgba(239,68,68,.12);}
    .history-empty{font-size:12px;color:var(--text-muted);padding:8px 14px;}
    .sidebar-footer{border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:12px;}
    .avatar{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;padding:4px;}
    .user-info{flex:1;overflow:hidden;}
    .user-name{font-size:13px;font-weight:600;}
    .user-role{font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;}
    .logout-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:var(--text-muted);border-radius:9px;transition:all var(--t-micro);flex-shrink:0;}
    .logout-btn:hover{color:var(--red);background:rgba(239,68,68,.12);}

    /* ═══════════ MAIN ═══════════ */
    .chat-main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0;}
    .chat-header{height:68px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:20;flex-shrink:0;}
    .chat-header::after{content:"";position:absolute;left:0;right:0;bottom:-24px;height:24px;background:linear-gradient(var(--bg),transparent);pointer-events:none;opacity:0;transition:opacity var(--t-base);}
    .chat-main.has-msgs .chat-header::after{opacity:1;}
    .chat-main.has-msgs .chat-header{background:rgba(9,11,16,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}
    .header-left{display:flex;align-items:center;gap:12px;min-width:0;}
    .header-orb-slot{width:40px;height:40px;flex-shrink:0;}
    .header-text{transition:opacity var(--t-base) var(--ease-out),transform var(--t-base) var(--ease-out);min-width:0;}
    .chat-main.is-empty .header-text{opacity:0;transform:translateX(-8px);}
    .chat-header-title{font-family:var(--font-display);font-size:16px;font-weight:600;letter-spacing:-.2px;}
    .chat-header-sub{font-size:12px;color:var(--text-muted);margin-top:1px;height:16px;overflow:hidden;position:relative;}
    .sub-swap{display:block;animation:subIn 380ms var(--ease-out);white-space:nowrap;}
    @keyframes subIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .header-right{display:flex;align-items:center;gap:10px;}
    .status-badge{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-dim);padding:6px 12px 6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);}
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);position:relative;}
    .status-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);animation:ping 2.2s var(--ease-out) infinite;}
    @keyframes ping{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(3);opacity:0}}
    .client-chip{width:34px;height:34px;border-radius:10px;background:#fff;padding:3px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
    .client-chip img{width:100%;height:100%;object-fit:contain;}
    .hamburger-btn{display:none;width:38px;height:38px;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);cursor:pointer;color:var(--text-main);border-radius:11px;flex-shrink:0;}

    /* ═══════════ ORBE · NÚCLEO VIVO ═══════════ */
    .orb-layer{position:absolute;inset:0;pointer-events:none;z-index:25;}
    .sofia-orb{position:absolute;top:0;left:0;width:168px;height:168px;transform-origin:0 0;will-change:transform;transition:transform var(--t-hero) var(--ease-io);pointer-events:none;}
    .sofia-orb.no-anim{transition:none;}
    .orb-core{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
    .orb-core svg{position:relative;z-index:2;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 30px rgba(0,0,0,.35));}
    .orb-halo{position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--mode) 32%,transparent) 0%,transparent 62%);animation:haloBreath 4.5s ease-in-out infinite;transition:background 600ms;z-index:0;transform:scale(calc(1 + var(--lvl,0) * .45));}
    @keyframes haloBreath{0%,100%{opacity:.65}50%{opacity:1}}
    .orb-ring{position:absolute;inset:-6%;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--mode) 45%,transparent);opacity:0;z-index:1;}
    .orb-ring.r2{inset:-16%;border-style:dashed;border-width:1px;}
    .orb-state-thinking .orb-ring{opacity:1;border-color:transparent;border-top-color:var(--mode);border-right-color:color-mix(in srgb,var(--mode) 40%,transparent);animation:spin 1.1s linear infinite;}
    .orb-state-thinking .orb-ring.r2{opacity:.5;animation:spin 2.6s linear infinite reverse;border-color:color-mix(in srgb,var(--mode) 35%,transparent);border-style:dashed;}
    .orb-state-listening .orb-ring{opacity:.9;animation:listenRing 1.3s var(--ease-out) infinite;border-color:var(--red);}
    .orb-state-listening .orb-ring.r2{animation-delay:.45s;border-style:solid;}
    .orb-state-listening .orb-halo{background:radial-gradient(circle,rgba(239,68,68,.32) 0%,transparent 62%);}
    @keyframes listenRing{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
    .orb-state-happy .orb-core svg{animation:hop 620ms var(--ease-spring);}
    @keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-12%) scale(1.04)}70%{transform:translateY(2%) scale(.98)}100%{transform:none}}
    .orb-fallback{width:70%;height:70%;border-radius:38%;background:var(--accent);animation:haloBreath 2s infinite;}
    .blob-mini{display:block;overflow:visible;}
    .sofia-orb .orb-ring{border-width:calc(1.5px * var(--inv,1));}
    .sofia-orb .orb-ring.r2{border-width:calc(1px * var(--inv,1));}

    /* ═══════════ BIENVENIDA ═══════════ */
    .welcome{position:absolute;inset:68px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 24px 40px;z-index:5;transition:opacity 420ms var(--ease-out),transform 520ms var(--ease-out),filter 420ms;}
    .welcome.leaving{opacity:0;transform:translateY(-30px) scale(.97);filter:blur(6px);pointer-events:none;}
    .welcome-orb-slot{width:168px;height:168px;flex-shrink:0;margin-bottom:6px;}
    .welcome h2{font-family:var(--font-display);font-size:clamp(26px,4vw,40px);font-weight:600;letter-spacing:-1px;line-height:1.1;max-width:640px;}
    .welcome h2 .w{display:inline-block;opacity:0;transform:translateY(18px);filter:blur(8px);animation:wordIn 700ms var(--ease-out) forwards;animation-delay:calc(260ms + var(--i) * 70ms);}
    .welcome h2 .w.hl{background:linear-gradient(90deg,var(--accent),#8fe3a0);-webkit-background-clip:text;background-clip:text;color:transparent;}
    @keyframes wordIn{to{opacity:1;transform:none;filter:blur(0)}}
    .welcome p{color:var(--text-dim);font-size:14.5px;max-width:440px;line-height:1.6;opacity:0;animation:fadeUp 700ms var(--ease-out) 700ms forwards;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .composer-slot{width:min(760px,100%);flex-shrink:0;}
    .suggestions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px;margin-top:6px;}
    .suggestion-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:9px 15px 9px 12px;font-size:13px;cursor:pointer;color:var(--text-dim);opacity:0;animation:chipIn 600ms var(--ease-spring) forwards;animation-delay:calc(900ms + var(--i) * 60ms);transition:color var(--t-micro),border-color var(--t-micro),background var(--t-micro),translate 260ms var(--ease-out);translate:var(--mx,0) var(--my,0);}
    .suggestion-chip .ico{width:14px;height:14px;color:var(--accent);transition:transform var(--t-base) var(--ease-spring);}
    .suggestion-chip:hover{border-color:rgba(187,213,49,.45);color:var(--text-main);background:var(--accent-soft);}
    .suggestion-chip:hover .ico{transform:translateX(2px) rotate(-45deg);}
    @keyframes chipIn{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}

    /* ═══════════ MENSAJES ═══════════ */
    .messages-area{flex:1;overflow-y:auto;overflow-x:hidden;padding:28px 28px 44px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth;}
    .messages-inner{width:100%;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:6px;}
    .messages-area::-webkit-scrollbar{width:6px;}
    .messages-area::-webkit-scrollbar-track{background:transparent;}
    .messages-area::-webkit-scrollbar-thumb{background:rgba(187,213,49,.22);border-radius:4px;}
    .messages-area::-webkit-scrollbar-thumb:hover{background:rgba(187,213,49,.5);}
    .msg-row{display:flex;gap:12px;align-items:flex-start;position:relative;}
    .msg-row.group-start{margin-top:18px;}
    .msg-row.user{flex-direction:row-reverse;}
    .msg-avatar{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;}
    .msg-avatar.empty{visibility:hidden;}
    .msg-row.bot:not(.group-start)::before{content:"";position:absolute;left:14.5px;top:-14px;height:22px;width:1px;background:linear-gradient(transparent,var(--line-2));}
    .msg-col{display:flex;flex-direction:column;max-width:78%;min-width:0;}
    .msg-row.user .msg-col{align-items:flex-end;}
    .bubble{padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.65;word-break:break-word;position:relative;min-width:0;max-width:100%;}
    .bubble.user-bubble{background:linear-gradient(135deg,rgba(187,213,49,.16),rgba(187,213,49,.07));border:1px solid rgba(187,213,49,.24);border-bottom-right-radius:6px;color:var(--text-main);transform-origin:100% 100%;animation:userIn 520ms var(--ease-spring) both;}
    @keyframes userIn{0%{opacity:0;transform:translateY(46px) scale(.9)}100%{opacity:1;transform:none}}
    .bubble.bot-bubble{background:var(--surface);border:1px solid var(--line);border-top-left-radius:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transform-origin:0 0;animation:botIn 620ms var(--ease-out) both;}
    .msg-col.rich{flex:1;max-width:min(100%,820px);}
    .bubble.bot-bubble.rich{width:100%;padding:16px;}
    .bubble.bot-bubble.rich .action-btns{margin-top:14px;}
    .bubble.bot-bubble.is-error{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.06);}
    @keyframes botIn{0%{opacity:0;transform:translateY(10px) scale(.97);clip-path:inset(0 0 100% 0 round 18px)}100%{opacity:1;transform:none;clip-path:inset(0 0 0 0 round 18px)}}
    .bubble.bot-bubble > *{animation:fadeUp 520ms var(--ease-out) both;}
    .bubble.bot-bubble > *:nth-child(1){animation-delay:160ms}
    .bubble.bot-bubble > *:nth-child(2){animation-delay:260ms}
    .bubble.bot-bubble > *:nth-child(3){animation-delay:360ms}
    .bubble.bot-bubble > *:nth-child(4){animation-delay:460ms}
    .bubble.bot-bubble > *:nth-child(5){animation-delay:560ms}
    .bubble-time{font-size:10.5px;color:var(--text-muted);margin-top:5px;padding:0 6px;opacity:0;animation:fadeUp 400ms var(--ease-out) 500ms forwards;letter-spacing:.2px;}
    .bubble table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .bubble th{background:rgba(187,213,49,.08);color:var(--accent);font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap;font-size:12px;letter-spacing:.2px;}
    .bubble td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;}
    .bubble tr{animation:rowIn 460ms var(--ease-out) both;animation-delay:calc(220ms + var(--i,0) * 28ms);}
    @keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
    .bubble tr:last-child td{border-bottom:none;}
    .bubble tbody tr{transition:background var(--t-micro);}
    .bubble tbody tr:hover td{background:rgba(255,255,255,.035);}
    .bubble code{background:rgba(255,255,255,.07);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12px;transition:background var(--t-micro),border-color var(--t-micro);}
    .bubble code:hover{border-color:rgba(187,213,49,.5);}

    /* Pensando */
    .thinking-card{padding:14px 16px;width:340px;max-width:100%;}
    .thinking-label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);height:20px;overflow:hidden;}
    .thinking-label .sub-swap{background:linear-gradient(90deg,var(--text-muted) 0%,var(--text-main) 40%,var(--text-muted) 80%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:subIn 380ms var(--ease-out),shimmerText 1.8s linear infinite;}
    @keyframes shimmerText{to{background-position:-200% 0}}
    .skel{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
    .skel i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface-3) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;}
    .skel i.tall{height:120px;border-radius:12px;}
    .skel i.bar{height:16px;border-radius:9px;}
    @keyframes shimmer{to{background-position:-200% 0}}
    .typing{display:none;}

    /* Batería / almacenamiento */
    .dev-card{min-width:min(320px,100%);}
    .dev-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
    .dev-name{font-family:var(--font-display);font-weight:600;font-size:16px;}
    .dev-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
    .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;}
    .chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
    .chip.on{color:var(--green);background:rgba(34,197,94,.12);}
    .chip.on .dot{box-shadow:0 0 0 0 currentColor;animation:dotPulse 1.8s infinite;}
    .chip.off{color:var(--red);background:rgba(239,68,68,.1);}
    @keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}100%{box-shadow:0 0 0 7px rgba(34,197,94,0)}}
    .battery-row{display:flex;align-items:center;gap:14px;margin-top:14px;}
    .battery-bar-track{background:rgba(255,255,255,.06);border-radius:8px;height:12px;overflow:hidden;flex:1;position:relative;}
    .battery-bar-fill{height:100%;border-radius:8px;width:0;transition:width 1300ms cubic-bezier(.34,1.3,.64,1) 250ms;position:relative;overflow:hidden;}
    .battery-bar-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-100%);animation:sheen 2.4s var(--ease-io) 1.4s infinite;}
    @keyframes sheen{to{transform:translateX(100%)}}
    .battery-bar-fill.low{animation:lowPulse 1.2s ease-in-out infinite;}
    @keyframes lowPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}50%{box-shadow:0 0 14px 2px rgba(239,68,68,.55)}}
    .battery-num{font-family:var(--font-display);font-weight:700;font-size:28px;min-width:66px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
    .dev-foot{font-size:12px;color:var(--text-muted);margin-top:10px;display:flex;align-items:center;gap:6px;}
    .storage-card{margin-top:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px;}

    /* Mapa */
    .map-wrap{margin-top:10px;border-radius:14px;overflow:hidden;position:relative;animation:mapReveal 900ms var(--ease-out) both 120ms;border:1px solid var(--line);}
    @keyframes mapReveal{from{clip-path:circle(0% at 50% 50%);transform:scale(1.06)}to{clip-path:circle(75% at 50% 50%);transform:none}}
    .map-container{height:300px;}
    .leaflet-container{font-family:inherit!important;font-size:13px!important;background:var(--bg-3)!important;}
    .route-anim{stroke-dasharray:3000;stroke-dashoffset:3000;animation:drawRoute 2.2s var(--ease-io) .7s forwards;}
    @keyframes drawRoute{to{stroke-dashoffset:0}}
    .pin-last{position:relative;width:16px;height:16px;}
    .pin-last .core{position:absolute;inset:0;background:#fb7185;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px rgba(251,113,133,.9);animation:pinDrop 700ms var(--ease-spring) .9s both;}
    .pin-last .wave{position:absolute;inset:-2px;border-radius:50%;border:2px solid #fb7185;animation:radar 2s var(--ease-out) 1.4s infinite;opacity:0;}
    .pin-last .wave.w2{animation-delay:2.2s;}
    @keyframes pinDrop{from{transform:translateY(-30px) scale(.4);opacity:0}to{transform:none;opacity:1}}
    @keyframes radar{0%{transform:scale(1);opacity:.9}100%{transform:scale(4.5);opacity:0}}
    .map-legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;font-size:11px;color:var(--text-muted);}
    .map-legend span{display:flex;align-items:center;gap:6px;}
    .gmaps-link{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 14px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--text-main);border-radius:10px;text-decoration:none;font-size:12px;font-weight:500;transition:all var(--t-micro);}
    .gmaps-link:hover{border-color:var(--blue);background:rgba(79,142,247,.12);}
    .gmaps-link .ico{width:14px;height:14px;transition:transform var(--t-base) var(--ease-spring);}
    .gmaps-link:hover .ico{transform:translate(2px,-2px);}

    /* Botones de acción */
    .action-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
    .csv-btn,.informe-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;border-radius:99px;cursor:pointer;font-size:12.5px;font-weight:600;transition:all var(--t-micro) var(--ease-out);border:1px solid;}
    .csv-btn{background:var(--accent-soft);border-color:rgba(187,213,49,.32);color:var(--accent);}
    .csv-btn:hover{background:rgba(187,213,49,.22);border-color:var(--accent);transform:translateY(-1px);}
    .informe-btn{background:rgba(79,142,247,.1);border-color:rgba(79,142,247,.32);color:#7aa9ff;}
    .informe-btn:hover{background:rgba(79,142,247,.2);border-color:var(--blue);transform:translateY(-1px);}
    .csv-btn .ico,.informe-btn .ico{width:15px;height:15px;}
    .csv-btn:hover .ico{animation:dlBounce 700ms var(--ease-spring);}
    @keyframes dlBounce{0%{transform:none}40%{transform:translateY(3px)}100%{transform:none}}
    .informe-btn:hover .ico{animation:wiggle 600ms var(--ease-out);}
    @keyframes wiggle{25%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}100%{transform:none}}

    /* Hint clickable que viene del backend */
    .hint-clickable{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:12px;font-style:italic;cursor:pointer;padding:5px 11px;border-radius:99px;border:1px solid rgba(187,213,49,0.22);background:rgba(187,213,49,0.06);transition:all .2s var(--ease-out);user-select:none;text-decoration:none;}
    .hint-clickable:hover{background:rgba(187,213,49,0.14);border-color:rgba(187,213,49,0.45);transform:translateY(-1px);box-shadow:0 4px 14px rgba(187,213,49,0.14);}
    .hint-clickable:active{transform:translateY(0);}
    .hint-clickable .hint-icon{font-style:normal;font-size:14px;}

    /* ═══════════ COMPOSER ═══════════ */
    .input-area{padding:10px 28px 18px;position:relative;z-index:30;pointer-events:none;flex-shrink:0;will-change:transform;transition:transform var(--t-hero) var(--ease-io);}
    .input-area.no-anim{transition:none;}
    .composer{width:100%;max-width:760px;margin:0 auto;position:relative;pointer-events:auto;}
    .mode-badge-row{height:0;position:relative;}
    .mode-badge{position:absolute;bottom:8px;left:6px;display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--mode) 14%,var(--bg-2));border:1px solid color-mix(in srgb,var(--mode) 45%,transparent);border-radius:99px;padding:4px 6px 4px 10px;font-size:12px;font-weight:600;color:var(--mode);animation:badgeIn 420ms var(--ease-spring);}
    .mode-badge .ico{width:14px;height:14px;}
    @keyframes badgeIn{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
    .mode-badge-close{width:18px;height:18px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--mode) 20%,transparent);border:none;cursor:pointer;color:inherit;border-radius:50%;padding:0;transition:transform var(--t-micro);}
    .mode-badge-close:hover{transform:rotate(90deg);}
    .mode-badge-close .ico{width:11px;height:11px;}
    .input-wrapper{position:relative;display:flex;align-items:flex-end;gap:8px;background:rgba(20,24,33,.78);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border-radius:24px;padding:9px 9px 9px 10px;box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);transition:box-shadow var(--t-base) var(--ease-out);}
    /* Borde con gradiente que gira */
    @property --ang{syntax:"<angle>";inherits:false;initial-value:0deg;}
    .input-wrapper::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang),var(--line-2),var(--line-2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;transition:opacity var(--t-base);}
    .input-wrapper:focus-within::before,.input-wrapper.busy::before{background:conic-gradient(from var(--ang),transparent 0deg,var(--mode) 70deg,transparent 150deg,color-mix(in srgb,var(--mode) 40%,transparent) 250deg,transparent 360deg);animation:angSpin 4s linear infinite;}
    .input-wrapper.busy::before{animation-duration:1.4s;}
    .input-wrapper:focus-within{box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 0 4px color-mix(in srgb,var(--mode) 10%,transparent),inset 0 1px 0 rgba(255,255,255,.05);}
    @keyframes angSpin{to{--ang:360deg}}
    .chat-input{flex:1;background:transparent;border:none;outline:none;color:var(--text-main);font-size:14.5px;resize:none;line-height:1.5;max-height:120px;font-family:inherit;padding:8px 4px;min-height:38px;transition:opacity 200ms;}
    .chat-input::placeholder{color:var(--text-muted);transition:color 200ms;}
    .tool-btn,.mode-btn,.audio-btn{width:38px;height:38px;border-radius:13px;flex-shrink:0;background:var(--surface);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-dim);transition:all var(--t-micro) var(--ease-out);position:relative;outline:none;}
    .tool-btn:hover,.mode-btn:hover,.audio-btn:hover{color:var(--text-main);border-color:var(--line-2);background:var(--surface-2);}
    .mode-btn.mode-btn-active{color:var(--mode);border-color:color-mix(in srgb,var(--mode) 50%,transparent);background:color-mix(in srgb,var(--mode) 12%,transparent);}
    .mode-btn.open{color:var(--accent-ink);background:var(--mode);border-color:var(--mode);}
    .mode-btn .ico{transition:transform 380ms var(--ease-spring);}
    .mode-btn.open .ico{transform:rotate(-20deg) scale(1.1);}
    .audio-btn.recording{background:var(--red);border-color:var(--red);color:#fff;}
    .audio-btn.recording::after{content:"";position:absolute;inset:-1px;border-radius:inherit;animation:recPulse 1.2s ease-out infinite;}
    @keyframes recPulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}100%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
    .audio-btn.transcribing{color:var(--blue);border-color:rgba(79,142,247,.4);cursor:not-allowed;}
    .audio-btn.transcribing .ico{animation:spin .8s linear infinite;}
    .audio-btn svg{color:inherit;}
    .audio-toast{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--bg-3);border:1px solid var(--line-2);border-radius:10px;padding:6px 11px;font-size:11.5px;color:var(--text-dim);white-space:nowrap;pointer-events:none;z-index:10;animation:toastIn 300ms var(--ease-spring);box-shadow:var(--shadow);}
    @keyframes toastIn{from{opacity:0;transform:translate(-50%,6px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
    /* Onda de voz que reemplaza el textarea */
    .voice-overlay{position:absolute;left:96px;right:56px;top:9px;bottom:9px;display:flex;align-items:center;gap:12px;pointer-events:none;opacity:0;transform:scaleX(.6);transform-origin:left center;transition:opacity 260ms var(--ease-out),transform 420ms var(--ease-spring);}
    .voice-overlay.on{opacity:1;transform:none;}
    .voice-overlay canvas{flex:1;height:34px;min-width:0;}
    .voice-time{font-family:var(--font-display);font-size:13px;color:var(--red);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;}
    .voice-time::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1s infinite;}
    .voice-trans{font-size:13px;background:linear-gradient(90deg,var(--text-muted),var(--text-main),var(--text-muted));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmerText 1.4s linear infinite;}
    .input-wrapper.voice .chat-input{opacity:0;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    /* Botón enviar transformable */
    .send-btn{width:40px;height:40px;border-radius:14px;flex-shrink:0;background:var(--accent);border:none;cursor:pointer;display:grid;place-items:center;transition:background var(--t-micro),transform var(--t-micro) var(--ease-out),box-shadow var(--t-base);color:var(--accent-ink);position:relative;overflow:hidden;}
    .send-btn > span{grid-area:1/1;display:flex;transition:transform 420ms var(--ease-spring),opacity 220ms;}
    .send-btn .s-ready{transform:none;opacity:1;}
    .send-btn .s-load,.send-btn .s-done{transform:translateY(120%) scale(.5);opacity:0;}
    .send-btn.st-loading .s-ready,.send-btn.st-done .s-ready{transform:translateY(-120%) scale(.5);opacity:0;}
    .send-btn.st-loading .s-load,.send-btn.st-done .s-done{transform:none;opacity:1;}
    .send-btn:hover:not(:disabled){background:var(--accent-2);box-shadow:0 6px 22px rgba(187,213,49,.35);transform:translateY(-1px);}
    .send-btn:hover:not(:disabled) .s-ready .ico{animation:nudge 600ms var(--ease-spring);}
    @keyframes nudge{40%{transform:translate(2px,-2px)}100%{transform:none}}
    .send-btn:active:not(:disabled){transform:scale(.92);}
    .send-btn:disabled{background:var(--surface-2);color:var(--text-muted);cursor:not-allowed;}
    .send-btn.st-loading:disabled{background:color-mix(in srgb,var(--mode) 18%,transparent);color:var(--mode);}
    .send-btn.st-done{background:var(--green)!important;color:#fff!important;}
    .s-load .ring{width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;}
    .input-hint{font-size:11px;color:var(--text-muted);margin-top:9px;text-align:center;opacity:.8;transition:opacity var(--t-base);}
    .chat-main.is-empty .input-hint{opacity:0;}

    /* Selector de modos · abanico radial */
    .mode-wrap{position:relative;}
    .mode-fan{position:absolute;left:19px;bottom:19px;width:0;height:0;z-index:100;pointer-events:none;}
    .mode-fan::before{content:"";position:absolute;left:-210px;bottom:-210px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(9,11,16,.92) 30%,rgba(9,11,16,.6) 55%,transparent 70%);transform:scale(.2);opacity:0;transition:all 380ms var(--ease-out);}
    .mode-fan.open::before{transform:none;opacity:1;}
    .mode-option{position:absolute;left:0;bottom:0;width:56px;height:56px;margin:0 0 -28px -28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;cursor:pointer;background:var(--bg-3);border:1px solid var(--line-2);color:var(--text-dim);opacity:0;transform:translate(0,0) scale(.3);transition:transform 520ms var(--ease-spring),opacity 260ms var(--ease-out),background var(--t-micro),border-color var(--t-micro),color var(--t-micro);transition-delay:calc((5 - var(--i)) * 18ms);pointer-events:none;box-shadow:0 10px 28px rgba(0,0,0,.4);}
    .mode-fan.open .mode-option{opacity:1;transform:translate(var(--x),var(--y)) scale(1);pointer-events:auto;transition-delay:calc(var(--i) * 35ms);}
    .mode-option .ico{width:20px;height:20px;color:var(--c);}
    .mode-option span{font-size:9.5px;font-weight:600;letter-spacing:.2px;}
    .mode-option:hover{border-color:var(--c);color:var(--text-main);background:color-mix(in srgb,var(--c) 14%,var(--bg-3));}
    .mode-fan.open .mode-option:hover{transform:translate(var(--x),var(--y)) scale(1.1);transition-delay:0ms;}
    .mode-option.mode-option-active{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--bg-3));color:var(--text-main);}
    .mode-fan-title{position:absolute;left:-18px;bottom:196px;font-size:10.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;opacity:0;transition:opacity 300ms;}
    .mode-fan.open .mode-fan-title{opacity:1;transition-delay:200ms;}
    .mode-grid,.mode-popup{display:contents;}

    /* Scroll al final */
    .scroll-btn{position:absolute;bottom:calc(100% + 6px);left:50%;height:34px;padding:0 14px 0 10px;border-radius:99px;background:var(--bg-3);color:var(--text-main);border:1px solid var(--line-2);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;z-index:50;opacity:0;transform:translate(-50%,10px) scale(.9);transition:opacity 240ms var(--ease-out),transform 360ms var(--ease-spring);box-shadow:var(--shadow);pointer-events:none;}
    .scroll-btn .ico{width:15px;height:15px;color:var(--accent);}
    .scroll-btn.visible{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
    .scroll-btn:hover .ico{animation:dlBounce 700ms var(--ease-spring);}

    /* ═══════════ MODAL INFORME ═══════════ */
    .modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(5,6,9,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;animation:fadeIn .3s var(--ease-out);}
    .modal-overlay.closing{animation:fadeOut .26s var(--ease-io) forwards;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeOut{to{opacity:0}}
    .modal-box{background:var(--bg-2);border:1px solid var(--line-2);border-radius:24px;width:92vw;max-width:980px;height:90vh;display:flex;flex-direction:column;box-shadow:0 40px 120px rgba(0,0,0,.6);overflow:hidden;animation:modalFrom 620ms var(--ease-out) both;}
    @keyframes modalFrom{from{opacity:0;transform:translate(var(--dx,0),var(--dy,0)) scale(.08);border-radius:120px}60%{opacity:1}to{opacity:1;transform:none;border-radius:24px}}
    .modal-overlay.closing .modal-box{animation:modalOut .26s var(--ease-io) forwards;}
    @keyframes modalOut{to{opacity:0;transform:translateY(16px) scale(.96)}}
    .modal-header{padding:0 18px 0 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;height:66px;gap:12px;}
    .modal-title{font-family:var(--font-display);font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;}
    .modal-title .ico{color:var(--accent);}
    .m-chip{font-family:var(--font-body);font-size:11px;font-weight:600;border-radius:99px;padding:3px 10px;}
    .m-chip.type{background:rgba(79,142,247,.13);color:#7aa9ff;border:1px solid rgba(79,142,247,.3);}
    .m-chip.ok{background:var(--accent-soft);color:var(--accent);border:1px solid rgba(187,213,49,.3);animation:badgeIn 420ms var(--ease-spring);}
    .modal-header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .modal-action-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:11px;cursor:pointer;font-size:12.5px;font-weight:600;border:1px solid;transition:all var(--t-micro) var(--ease-out);animation:fadeUp 420ms var(--ease-out) both;}
    .modal-action-btn .ico{width:15px;height:15px;}
    .modal-action-btn:hover{transform:translateY(-1px);}
    .btn-download{background:var(--accent-soft);color:var(--accent);border-color:rgba(187,213,49,.3);}
    .btn-download:hover{background:rgba(187,213,49,.24);}

function detectarTipoInforme(msg) {
  if (!msg || msg.role !== "bot") return "ninguno";
  if (msg.informe_data && (msg.informe_data.tipo === "dispositivo" || msg.informe_data.tipo === "flota")) return msg.informe_data.tipo;
  if (msg.map) return "dispositivo";
  if (msg.html) {
    const h = msg.html;
    const esDetalle = h.includes("Serial:") && h.includes("Estado:") && h.includes("Batería:") && !h.includes("<tr><td>#</td>");
    if (esDetalle) return "dispositivo";
    if (h.includes("<table")) return "flota";
  }
  return "ninguno";
}

function parsearMetricasFlota(html, informeData) {
  if (informeData && informeData.tipo === 'flota' && informeData.kpis) {
    return { total:informeData.kpis.total, online:informeData.kpis.online, offline:informeData.kpis.offline, modelos:informeData.kpis.modelos, modelosArr:informeData.modelosArr||[], textoPlano:"" };
  }
  const parser = new DOMParser();
  const doc = parser.parseFromString(html || "","text/html");
  const texto = doc.body.innerText || doc.body.textContent || "";
  const onlineMatch  = texto.match(/(?:🟢|En línea|Conectados?|Encendidos?)[\s:·]*(\d+)/i);
  const offlineMatch = texto.match(/(?:🔴|Desconectados?|Apagados?)[\s:·]*(\d+)/i);
  const totalMatch   = texto.match(/Total[^\d]*(\d+)/i);
  return { total:totalMatch?parseInt(totalMatch[1]):null, online:onlineMatch?parseInt(onlineMatch[1]):null, offline:offlineMatch?parseInt(offlineMatch[1]):null, modelos:null, modelosArr:[], textoPlano:texto.slice(0,3000) };
}

function parsearDatosDispositivo(msg) {
  if (msg.informe_data && msg.informe_data.tipo === 'dispositivo' && msg.informe_data.dispositivo) {
    const d = msg.informe_data.dispositivo;
    return {
      nombre:d.nombre||"Dispositivo", serial:d.serial||"N/D", modelo:d.modelo||"N/D",
      fabricante:d.fabricante||"", estado:d.estado||"Desconectado", bateria:d.bateria,
      negocio:d.negocio||"NUTRESA MOVILIDAD", ultimaConex:d.ultimaConex||"N/D",
      lat:d.lat, lng:d.lng,
      puntosGPS:msg.informe_data.puntosGPS||[], puntosBat:msg.informe_data.puntosBat||[],
      puntosRed:msg.informe_data.puntosRed||[], puntosTrafico:msg.informe_data.puntosTrafico||[],
      storage:msg.informe_data.storage||null,
    };
  }
  const bat = msg.battery || {};
  const parser = new DOMParser();
  const doc = msg.html ? parser.parseFromString(msg.html,"text/html") : null;
  const texto = doc ? (doc.body.innerText||doc.body.textContent||"") : "";
  const getField = label => { const m=texto.match(new RegExp(label+"[:\\s]+([^\\n]+)","i")); return m?m[1].trim():null; };
  let puntosGPS = [];
  if (msg.map&&msg.map.history&&msg.map.history.length>0) puntosGPS=msg.map.history;
  else if (msg.map) puntosGPS=[{lat:msg.map.lat,lng:msg.map.lng,fecha:"Último registro",num:1}];
  return {
    nombre:bat.name||getField("dispositivo")||"Dispositivo", serial:bat.serial||getField("serial")||"N/D",
    modelo:bat.model||getField("modelo")||"N/D", fabricante:getField("fabricante")||"",
    estado:getField("estado")||(bat.online_raw?"Conectado":"Desconectado"),
    bateria:bat.level!=null?bat.level:(parseInt(getField("batería"))||null),
    negocio:getField("negocio")||CLIENTE_CONFIG.nombre,
    ultimaConex:bat.lastSeen||getField("última conex")||"N/D",
    lat:msg.map?msg.map.lat:null, lng:msg.map?msg.map.lng:null,
    puntosGPS, puntosBat:[], puntosRed:[], puntosTrafico:[], storage:null,
  };
}

async function generarAnalisisIA(tipo, informeData) {
  const resp = await fetch(API_BASE+"/webhook/api/informe", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tipo, informe_data:informeData, cliente_nombre:CLIENTE_CONFIG?CLIENTE_CONFIG.nombre:''})
  });
  if (!resp.ok) throw new Error("HTTP "+resp.status+" al llamar /api/informe");
  const data = await resp.json();
  if (!data.analisis) throw new Error("El servidor no devolvió análisis");
  return data.analisis;
}

function descargarHtml(htmlContent, filename) {
  const blob=new Blob([htmlContent],{type:"text/html;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function downloadCSV(html, filename) {
  const parser=new DOMParser(), doc=parser.parseFromString(html,"text/html");
  const tables=doc.querySelectorAll("table");
  if (!tables.length) return;
  let csv="\uFEFF";
  tables.forEach((table,tIdx)=>{
    const titulo=table.querySelector("th[colspan]");
    if(titulo) csv+='"'+(titulo.textContent||"").replace(/"/g,'""').trim()+'"\n';
    table.querySelectorAll("tr").forEach(row=>{
      if((row.textContent||"").includes("💡")) return;
      if(row.querySelector("th[colspan]")) return;
      const vals=Array.from(row.querySelectorAll("th,td")).map(c=>'"'+(c.textContent||"").trim().replace(/\n/g," ").replace(/"/g,'""')+'"');
      if(vals.length) csv+=vals.join(",")+"\n";
    });
    if(tIdx<tables.length-1) csv+="\n";
  });
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

  ".donut-c span{font-size:11px;color:var(--muted);margin-top:4px;}",
  ".bigbar{display:flex;gap:3px;height:14px;border-radius:99px;overflow:hidden;background:#eef0f3;}",
  ".bigbar i{display:block;height:100%;}",

  ".data-table td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);color:var(--text);font-variant-numeric:tabular-nums;}",

].join("");

function informeHead(titulo, extraHead, extraCss) {
  return '<!DOCTYPE html><html lang="es"><head>'
    +'<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>'
    +'<title>'+titulo+'</title>'
    +FONTS_LINK
    +(extraHead||'')
    +'<style>'+SF_VARS_LIGHT+CSS_SF+CSS_INFORME_BASE+(extraCss||'')+'</style>'
    +'</head><body><div class="page">';
}
function informeTopbar(etiqueta, fechaStr) {
  return '<div class="topbar"><div class="brand">'+EMPRESA+'<span class="x">×</span><span class="sofia">'+sofiaBlobSvg(20)+'SofIA</span></div>'
    +'<div class="topmeta">'+etiqueta+'<br>'+fechaStr+'</div></div>';
}
function informeSec(n, titulo, sub, cuerpo) {
  return '<section class="sec"><div class="sec-h"><span class="sec-n">'+n+'</span><span class="sec-t">'+titulo+'</span>'+(sub?'<span class="sec-s">'+sub+'</span>':'')+'</div>'+cuerpo+'</section>';
}
function informeAnalisis(analisis, titulo) {
  var cuerpo = analisis
    ? analisis.split(/\n+/).filter(function(x){return x.trim();}).map(function(x){return '<p>'+x+'</p>';}).join('')
    : '<p class="empty">Análisis no disponible.</p>';
  return '<div class="analysis"><div>'+sofiaBlobSvg(56, analisis?'happy':'idle')+'</div><div><div class="who">'+(titulo||'Análisis de SofIA')+'</div>'+cuerpo+'</div></div>';
}
function informePie(fechaStr, horaStr) {
  return '<div class="rf"><div><b>'+EMPRESA+'</b> · Informe generado por SofIA para '+(CLIENTE_CONFIG?CLIENTE_CONFIG.nombre:'')+'</div><div>'+fechaStr+' · '+horaStr+'</div></div>';
}
function donutSvg(pct) {
  var r=54, c=2*Math.PI*r, on=Math.max(0,Math.min(100,pct||0))/100*c;
  return '<svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="'+r+'" fill="none" stroke="#f3c4c4" stroke-width="14"/>'
    +'<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="#16a34a" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+on.toFixed(1)+' '+c.toFixed(1)+'"/></svg>';
}

// Gráfica de modelos (encendidos vs apagados) — HTML puro, nítida al imprimir
function generarSvgBarrasModelos(modelosArr, titulo) {
  if (!modelosArr || modelosArr.length === 0) return "";
  var items=modelosArr.slice(0,15), maxVal=Math.max.apply(null,items.map(function(m){return m.total;}).concat([1]));
  var rows='<div class="mrow"><span class="mhead">Modelo</span><span class="mhead">Encendidos / apagados</span><span class="mhead" style="text-align:right">Total</span><span class="mhead" style="text-align:right">%</span></div>';
  items.forEach(function(m){
    var w=Math.max(2,Math.round((m.total/maxVal)*100)), pOn=m.total>0?Math.round((m.on/m.total)*100):0;
    var col=pOn>=70?"var(--on)":pOn>=40?"var(--mid)":"var(--off)";
    rows+='<div class="mrow"><span class="mname" title="'+m.nombre+'">'+m.nombre+'</span>'
      +'<div class="mtrack"><div class="mbar" style="width:'+w+'%">'
      +(m.on>0?'<i class="on" style="width:'+pOn+'%">'+(pOn>=12?m.on:'')+'</i>':'')
      +(m.off>0?'<i class="off" style="width:'+(100-pOn)+'%">'+((100-pOn)>=12?m.off:'')+'</i>':'')
      +'</div></div><span class="mtot">'+m.total+'</span><span class="mpct" style="color:'+col+'">'+pOn+'%</span></div>';
  });
  return '<div class="models">'+rows+'</div><p class="note">'+titulo+' · % = conectividad por modelo</p>';
}

// GENERADOR INFORME FLOTA
// ════════════════════════════════════════════════════════════════════
function generarInformeFlota(htmlFuente, analisis, informeDataParam) {
  var fecha=new Date();
  var fechaStr=fecha.toLocaleDateString("es-CO",{day:"2-digit",month:"long",year:"numeric"});
  var horaStr=fecha.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
  var periodo=fecha.toLocaleDateString("es-CO",{month:"long",year:"numeric"});
  var m=parsearMetricasFlota(htmlFuente,informeDataParam);
  var total=m.total, online=m.online, offline=m.offline, modelos=m.modelos, modelosArr=m.modelosArr;
  var has=function(v){return v!==null&&v!==undefined;};
  var onlineVal=has(online)?online:"—", offlineVal=has(offline)?offline:"—", totalVal=has(total)?total:"—", modelosVal=has(modelos)?modelos:"—";
  var pctOnline=(total&&has(online))?Math.round((online/total)*100):null;
  var pctOffline=(total&&has(offline))?Math.round((offline/total)*100):null;
  var titulo=(informeDataParam&&informeDataParam.titulo)||("Flota "+CLIENTE_CONFIG.nombre);

  var lede = has(total)
    ? 'La flota de <b>'+CLIENTE_CONFIG.nombre+'</b> registra <b>'+totalVal+' dispositivos</b>'
      +(pctOnline!=null?', de los cuales el <b>'+pctOnline+'%</b> está en línea':'')
      +(has(modelos)?' y se compone de <b>'+modelosVal+' modelos</b>':'')+'. Datos consultados en SOTI MobiControl el '+fechaStr+'.'
    : 'Resumen de la flota de <b>'+CLIENTE_CONFIG.nombre+'</b> consultado en SOTI MobiControl el '+fechaStr+'.';

  var n=0, num=function(){ n++; return (n<10?"0":"")+n; };
  var secResumen=informeSec(num(),"Resumen ejecutivo",periodo,
    '<div class="kpis">'
    +'<div class="kpi info"><div class="kpi-v">'+totalVal+'</div><div class="kpi-l">Dispositivos</div><div class="kpi-s">Flota completa</div></div>'
    +'<div class="kpi on"><div class="kpi-v">'+onlineVal+'</div><div class="kpi-l">En línea</div><div class="kpi-s">'+(pctOnline!=null?pctOnline+"% del total":"—")+'</div></div>'
    +'<div class="kpi off"><div class="kpi-v">'+offlineVal+'</div><div class="kpi-l">Desconectados</div><div class="kpi-s">'+(pctOffline!=null?pctOffline+"% del total":"—")+'</div></div>'
    +'<div class="kpi acc"><div class="kpi-v">'+modelosVal+'</div><div class="kpi-l">Modelos únicos</div><div class="kpi-s">Tipos de dispositivo</div></div>'
    +'</div>');

  var secConn="";
  if(has(online)||has(offline)){
    secConn=informeSec(num(),"Conectividad","Estado actual",
      '<div class="conn"><div class="donut">'+donutSvg(pctOnline||0)+'<div class="donut-c"><b>'+(pctOnline!=null?pctOnline+'%':'—')+'</b><span>en línea</span></div></div>'
      +'<div><div class="bigbar"><i class="on" style="width:'+(pctOnline||0)+'%"></i><i class="off" style="width:'+(pctOffline||0)+'%"></i></div>'
      +'<div class="legend"><div style="--c:var(--on)"><b>'+onlineVal+'</b><span>Conectados</span></div><div style="--c:var(--off)"><b>'+offlineVal+'</b><span>Sin conexión</span></div><div style="--c:#cbd5e1"><b>'+totalVal+'</b><span>Total</span></div></div></div></div>');
  }

  var secModelos=modelosArr&&modelosArr.length>0
    ? informeSec(num(),"Distribución por modelo",modelosArr.length+" modelos",generarSvgBarrasModelos(modelosArr,"Encendidos vs apagados — "+periodo))
    : "";

  var fuente=String(htmlFuente||"").replace(/<details class="sf-sec"(?! open)/g,'<details class="sf-sec" open');
  var secDatos=informeSec(num(),"Datos detallados","Respuesta de SofIA",'<div class="sf-wrap">'+fuente+'</div>');
  var secAnalisis=informeSec(num(),"Análisis e interpretación","Generado con IA",informeAnalisis(analisis));

  return informeHead('Informe Flota — '+EMPRESA+' — '+fechaStr)
    +informeTopbar('Informe técnico · Flota',fechaStr)
    +'<div class="cover"><span class="eyebrow">Informe de flota</span><h1>'+titulo+'</h1><p class="lede">'+lede+'</p>'
    +'<div class="meta"><div><div class="mlabel">Cliente</div><div class="mval">'+CLIENTE_CONFIG.nombre+'</div></div>'
    +'<div><div class="mlabel">Fecha</div><div class="mval">'+fechaStr+'</div></div>'
    +'<div><div class="mlabel">Hora</div><div class="mval">'+horaStr+' (Colombia)</div></div>'
    +'<div><div class="mlabel">Período</div><div class="mval">'+periodo.charAt(0).toUpperCase()+periodo.slice(1)+'</div></div></div></div>'
    +'<div class="body">'+secResumen+secConn+secModelos+secDatos+secAnalisis+'</div>'
    +informePie(fechaStr,horaStr)
    +'</div></body></html>';
}

// GENERADOR INFORME DISPOSITIVO
// ════════════════════════════════════════════════════════════════════
function generarInformeDispositivo(datos, htmlFuente, analisis) {
  var fecha=new Date();
  var fechaStr=fecha.toLocaleDateString("es-CO",{day:"2-digit",month:"long",year:"numeric"});
  var horaStr=fecha.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
  var nombre=datos.nombre, serial=datos.serial, modelo=datos.modelo, fabricante=datos.fabricante;
  var estado=datos.estado, bateria=datos.bateria, negocio=datos.negocio, ultimaConex=datos.ultimaConex;
  var lat=datos.lat, lng=datos.lng, puntosGPS=datos.puntosGPS||[], puntosBat=datos.puntosBat||[];
  var puntosRed=datos.puntosRed||[], puntosTrafico=datos.puntosTrafico||[], storage=datos.storage||null;

  var conectado=(estado&&estado.toLowerCase().includes("línea"))||estado==="Conectado";
  var batColor=bateria>=60?"var(--on)":bateria>=30?"var(--mid)":"var(--off)";
  var batPct=bateria!=null?bateria:0;
  var batStr=bateria!=null?bateria+"%":"N/D";
  var googleMapsUrl=(lat&&lng)?"https://www.google.com/maps?q="+lat+","+lng:null;
  var n=0, num=function(){ n++; return (n<10?"0":"")+n; };
  var lvl=function(v){return v>=70?'hi':v>=30?'mid':'lo';};

  // ── Ficha ──
  var secFicha=informeSec(num(),"Ficha técnica","Estado al "+fechaStr,
    '<div class="facts">'
    +'<div class="fact"><div class="mlabel">Estado</div><div class="v"><span class="chip '+(conectado?'on':'off')+'">'+(conectado?'En línea':'Desconectado')+'</span></div><div class="s">Última conexión: '+ultimaConex+'</div></div>'
    +'<div class="fact"><div class="mlabel">Batería</div><div class="gauge"><span class="t"><i style="width:'+batPct+'%;background:'+batColor+'"></i></span><b style="color:'+batColor+'">'+batStr+'</b></div></div>'
    +'<div class="fact"><div class="mlabel">Modelo</div><div class="v">'+modelo+'</div><div class="s">'+(fabricante||'—')+'</div></div>'
    +'<div class="fact"><div class="mlabel">Negocio / Regional</div><div class="v" style="font-size:13.5px">'+negocio+'</div></div>'
    +'</div>');

  // ── Almacenamiento ──
  var secStorage="";
  if(storage){
    var sp=storage.pct||0, sl=sp>=90?'lo':sp>=70?'mid':'hi';
    secStorage=informeSec(num(),"Almacenamiento interno",storage.totalGB+" GB",
      '<div class="kpis">'
      +'<div class="kpi '+(sl==='lo'?'off':sl==='mid'?'mid':'on')+'"><div class="kpi-v">'+sp+'<small>%</small></div><div class="kpi-l">Ocupado</div></div>'
      +'<div class="kpi"><div class="kpi-v">'+storage.usadoGB+'<small>GB</small></div><div class="kpi-l">Usado</div></div>'
      +'<div class="kpi on"><div class="kpi-v">'+storage.dispGB+'<small>GB</small></div><div class="kpi-l">Disponible</div></div>'
      +'<div class="kpi info"><div class="kpi-v">'+storage.totalGB+'<small>GB</small></div><div class="kpi-l">Capacidad</div></div>'
      +'</div><div class="sf" style="margin-top:18px"><span class="sf-meter big '+sl+'" style="--w:'+sp+'%"><i></i></span></div>');
  }

  // ── GPS ──
  var tablaGPS=puntosGPS.length>0
    ?'<table class="data-table"><thead><tr><th>#</th><th>Fecha y hora</th><th>Latitud</th><th>Longitud</th></tr></thead><tbody>'
      +puntosGPS.map(function(p,i){var esUlt=i===0,esPri=i===puntosGPS.length-1&&puntosGPS.length>1;return '<tr class="'+(esUlt?'hl':'')+'">'
        +'<td><b>'+(p.num||i+1)+'</b></td>'
        +'<td>'+(p.fecha||'N/D')+(esUlt?'<span class="tag last">último</span>':esPri?'<span class="tag first">primero</span>':'')+'</td>'
        +'<td class="mono">'+(typeof p.lat==='number'?p.lat.toFixed(6):p.lat)+'</td>'
        +'<td class="mono">'+(typeof p.lng==='number'?p.lng.toFixed(6):p.lng)+'</td>'
        +'</tr>';}).join('')
      +'</tbody></table><p class="note">Mostrando '+puntosGPS.length+' registros GPS del mes en curso</p>'
    :'<p class="note">Sin registros GPS disponibles.</p>';

  var leafletScript="";
  if(lat&&lng){
    var puntosJson=JSON.stringify(puntosGPS.length>0?puntosGPS:[{lat:lat,lng:lng,fecha:"Último registro",num:1}]);
    leafletScript='<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>'
      +'<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>'
      +'<script>window.addEventListener("load",function(){'
      +'var puntos='+puntosJson+';'
      +'var map=L.map("mapa-informe",{zoomControl:false}).setView([puntos[0].lat,puntos[0].lng],15);'
      +'L.tileLayer("https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",{attribution:"© Google Maps",maxZoom:20}).addTo(map);'
      +'if(puntos.length>1){var ll=puntos.map(function(p){return[p.lat,p.lng];});L.polyline(ll,{color:"#0d0f14",weight:3,opacity:.8,dashArray:"6 6"}).addTo(map);map.fitBounds(L.latLngBounds(ll),{padding:[30,30]});}'
      +'var mk=function(bg,s){return L.divIcon({className:"",html:"<div style=\\"background:"+bg+";width:"+s+"px;height:"+s+"px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.35);\\"></div>",iconSize:[s,s],iconAnchor:[s/2,s/2]});};'
      +'var iU=mk("#bbd531",16),iP=mk("#0d0f14",12),iN=mk("#94a3b8",9);'
      +'var nP=puntos.length;'
      +'puntos.forEach(function(p,i){var esU=i===0,esP=i===nP-1&&nP>1;L.marker([p.lat,p.lng],{icon:esU?iU:esP?iP:iN}).addTo(map).bindPopup("<b>"+(esU?"Último punto":esP?"Primer punto":"Punto "+p.num)+"</b><br>"+p.fecha);});'
      +'});<\/script>';
  }
  var secGPS=lat&&lng
    ? informeSec(num(),"Ubicación y recorrido",puntosGPS.length+" puntos GPS",
        '<div class="mapa-wrap"><div id="mapa-informe"></div></div>'
        +(googleMapsUrl?'<a class="map-link" href="'+googleMapsUrl+'" target="_blank">Abrir último punto en Google Maps ↗</a>':'')
        +'<div style="margin-top:22px">'+tablaGPS+'</div>')
    : informeSec(num(),"Ubicación GPS","",'<div class="warn">Sin coordenadas GPS disponibles para este dispositivo.</div>');

  // ── Batería histórica ──
  var secBateria="";
  if(puntosBat&&puntosBat.length>=2){
    var bat=puntosBat,nb=bat.length,svgW=680,svgH=210,padL=40,padR=14,padT=18,padB=34;
    var chartW=svgW-padL-padR,chartH=svgH-padT-padB;
    var xS=function(i){return padL+(i/(nb-1))*chartW;};
    var yS=function(v){return padT+chartH-(Math.min(100,Math.max(0,v))/100)*chartH;};
    var refs="";
    [{v:80,c:'hi'},{v:50,c:'mid'},{v:20,c:'lo'}].forEach(function(r){var y=yS(r.v);refs+='<line class="sf-ref '+r.c+'" x1="'+padL+'" y1="'+y+'" x2="'+(svgW-padR)+'" y2="'+y+'"/><text class="sf-axis-t" x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+r.v+'%</text>';});
    var lp=bat.map(function(p,i){return xS(i).toFixed(1)+","+yS(p.bateria).toFixed(1);});
    var avg=bat.reduce(function(s,p){return s+p.bateria;},0)/nb, nl=avg>=50?'hi':avg>=20?'mid':'lo';
    var pts=bat.map(function(p,i){return '<circle class="sf-pt '+lvl(p.bateria)+'" cx="'+xS(i).toFixed(1)+'" cy="'+yS(p.bateria).toFixed(1)+'" r="3.5"><title>'+p.fecha+': '+p.bateria+'%</title></circle>';}).join('');
    var xl="";
    [0,Math.floor(nb/2),nb-1].filter(function(v,i,a){return a.indexOf(v)===i;}).forEach(function(i){var p=bat[i];if(!p)return;var s=p.fecha.includes(",")?p.fecha.split(",")[1].trim():p.fecha;xl+='<text class="sf-axis-t" x="'+xS(i)+'" y="'+(svgH-8)+'" text-anchor="'+(i===0?'start':i===nb-1?'end':'middle')+'">'+s+'</text>';});
    var minB=Math.min.apply(null,bat.map(function(p){return p.bateria;})), maxB=Math.max.apply(null,bat.map(function(p){return p.bateria;}));
    secBateria=informeSec(num(),"Historial de batería","Últimos "+nb+" registros",
      '<div class="kpis" style="margin-bottom:22px">'
      +'<div class="kpi '+(avg>=50?'on':avg>=20?'mid':'off')+'"><div class="kpi-v">'+Math.round(avg)+'<small>%</small></div><div class="kpi-l">Promedio</div></div>'
      +'<div class="kpi off"><div class="kpi-v">'+minB+'<small>%</small></div><div class="kpi-l">Mínimo</div></div>'
      +'<div class="kpi on"><div class="kpi-v">'+maxB+'<small>%</small></div><div class="kpi-l">Máximo</div></div>'
      +'<div class="kpi"><div class="kpi-v">'+bat[nb-1].bateria+'<small>%</small></div><div class="kpi-l">Último registro</div></div>'
      +'</div><div class="sf"><div class="sf-chart"><svg viewBox="0 0 '+svgW+' '+svgH+'" width="100%" xmlns="http://www.w3.org/2000/svg">'
      +refs+'<path class="sf-area '+nl+'" d="M'+lp.join(' L')+' L'+xS(nb-1)+','+(padT+chartH)+' L'+xS(0)+','+(padT+chartH)+' Z"/>'
      +'<polyline class="sf-line '+nl+'" pathLength="1" points="'+lp.join(' ')+'"/>'+pts
      +'<line class="sf-axis" x1="'+padL+'" y1="'+(padT+chartH)+'" x2="'+(svgW-padR)+'" y2="'+(padT+chartH)+'"/>'+xl
      +'</svg><div class="sf-legend"><span class="hi">Alta ≥70%</span><span class="mid">Media 30–69%</span><span class="lo">Baja &lt;30%</span></div></div></div>');
  }

  // ── Red ──
  var secRed="";
  if(puntosRed&&puntosRed.length>0){
    var red=puntosRed,rn=red.length,validos=red.filter(function(r){return r.signal_dbm>-127;});
    var wifiCount=red.filter(function(r){return r.tipo_conexion==="WiFi";}).length,celCount=rn-wifiCount;
    var avgDbm=validos.length?validos.reduce(function(s,r){return s+r.signal_dbm;},0)/validos.length:-70;
    var dbmAvg=validos.length?Math.round(avgDbm):null;
    var sl2=function(d){return d<=-127?'na':d>=-60?'hi':d>=-75?'mid':'lo';};
    var filas2=red.map(function(r,i){var esU=i===rn-1;return '<tr class="'+(esU?'hl':'')+'"><td>'+(i+1)+'</td><td>'+r.fecha+'</td><td>'+r.tipo_conexion+'</td><td><span class="sf-sig '+sl2(r.signal_dbm)+'">'+(r.signal_dbm<=-127?'N/C':r.signal_dbm+' dBm')+'</span></td><td>'+r.calidad_senal+'</td><td>'+(r.red_wifi||r.operador||'—')+'</td><td class="mono">'+(r.direccion_ip||'—')+'</td></tr>';}).join('');
    secRed=informeSec(num(),"Historial de conectividad",rn+" registros",
      '<div class="kpis" style="margin-bottom:22px">'
      +'<div class="kpi info"><div class="kpi-v">'+wifiCount+'</div><div class="kpi-l">Eventos WiFi</div></div>'
      +'<div class="kpi"><div class="kpi-v">'+celCount+'</div><div class="kpi-l">Eventos celular</div></div>'
      +'<div class="kpi '+(dbmAvg===null?'':avgDbm>=-60?'on':avgDbm>=-75?'mid':'off')+'"><div class="kpi-v">'+(dbmAvg!==null?dbmAvg+'<small>dBm</small>':'—')+'</div><div class="kpi-l">Señal promedio</div></div>'
      +'<div class="kpi"><div class="kpi-v" style="font-size:22px;letter-spacing:-.4px">'+((red[rn-1]&&(red[rn-1].operador||red[rn-1].red_wifi))||'—')+'</div><div class="kpi-l">Última red</div></div>'
      +'</div><div class="sf"><table class="data-table"><thead><tr><th>#</th><th>Fecha</th><th>Tipo</th><th>Señal</th><th>Calidad</th><th>Red</th><th>IP</th></tr></thead><tbody>'+filas2+'</tbody></table></div>');
  }

  // ── Tráfico ──
  var secTrafico="";
  if(puntosTrafico&&puntosTrafico.length>0){
    var tr=puntosTrafico;
    var totalUpMB=tr.reduce(function(s,r){return s+(r.uploadMB||0);},0);
    var totalDownMB=tr.reduce(function(s,r){return s+(r.downloadMB||0);},0);
    var totalMBT=tr.reduce(function(s,r){return s+(r.totalMB||0);},0);
    var maxMBT=Math.max.apply(null,tr.map(function(r){return r.totalMB||0;}).concat([1]));
    var fmtMB=function(mb){return mb>=1000?(mb/1024).toFixed(1)+' GB':mb.toFixed(0)+' MB';};
    var filasT=tr.map(function(r){
      var pct=Math.round((r.totalMB/maxMBT)*100), l=r.totalMB>=100?'lo':r.totalMB>=50?'mid':'hi';
      return '<tr><td><b>'+(r.aplicacion||'Desconocida')+'</b></td><td>'+(r.tipoConexion||'—')+'</td>'
        +'<td><span class="sf-rowbar '+l+'" style="--w:'+pct+'%"><i></i><em>'+fmtMB(r.totalMB)+'</em></span></td>'
        +'<td style="text-align:right">'+fmtMB(r.uploadMB||0)+'</td><td style="text-align:right">'+fmtMB(r.downloadMB||0)+'</td><td>'+(r.ultimoRegistro||'—')+'</td></tr>';
    }).join('');
    secTrafico=informeSec(num(),"Consumo de datos por aplicación","Top "+tr.length+" apps",
      '<div class="kpis" style="margin-bottom:22px">'
      +'<div class="kpi info"><div class="kpi-v">'+fmtMB(totalMBT)+'</div><div class="kpi-l">Total consumido</div></div>'
      +'<div class="kpi on"><div class="kpi-v">'+fmtMB(totalDownMB)+'</div><div class="kpi-l">Descargado</div></div>'
      +'<div class="kpi mid"><div class="kpi-v">'+fmtMB(totalUpMB)+'</div><div class="kpi-l">Subido</div></div>'
      +'<div class="kpi"><div class="kpi-v">'+tr.length+'</div><div class="kpi-l">Aplicaciones</div></div>'
      +'</div><div class="sf"><table class="data-table"><thead><tr><th>Aplicación</th><th>Conexión</th><th>Total</th><th style="text-align:right">Sube</th><th style="text-align:right">Baja</th><th>Último reg.</th></tr></thead><tbody>'+filasT+'</tbody></table></div>');
  }

  var secAnalisis=informeSec(num(),"Diagnóstico técnico","Generado con IA",informeAnalisis(analisis,"Diagnóstico de SofIA"));

  var lede='Informe individual del dispositivo <b>'+nombre+'</b> ('+modelo+(fabricante?' · '+fabricante:'')+'), '
    +(conectado?'actualmente <b>en línea</b>':'actualmente <b>desconectado</b>')
    +(bateria!=null?' con <b>'+batStr+'</b> de batería':'')+'. Asignado a '+negocio+'.';

  return informeHead('Informe Dispositivo '+serial+' — '+EMPRESA, leafletScript)
    +informeTopbar('Informe técnico · Dispositivo',fechaStr)
    +'<div class="cover"><span class="eyebrow">Informe de dispositivo</span><h1>'+nombre+'</h1>'
    +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-2px 0 16px;position:relative;z-index:1"><span class="serial">'+serial+'</span><span class="chip '+(conectado?'on':'off')+'">'+(conectado?'En línea':'Desconectado')+'</span></div>'
    +'<p class="lede">'+lede+'</p>'
    +'<div class="meta"><div><div class="mlabel">Cliente</div><div class="mval">'+CLIENTE_CONFIG.nombre+'</div></div>'
    +'<div><div class="mlabel">Fecha</div><div class="mval">'+fechaStr+'</div></div>'
    +'<div><div class="mlabel">Hora</div><div class="mval">'+horaStr+' (Colombia)</div></div>'
    +'<div><div class="mlabel">Última conexión</div><div class="mval">'+ultimaConex+'</div></div></div></div>'
    +'<div class="body">'+secFicha+secStorage+secGPS+secBateria+secRed+secTrafico+secAnalisis+'</div>'
    +informePie(fechaStr,horaStr)
    +'</div></body></html>';
}

// MODAL — usa Blob URL para el iframe (fix file://)
// ════════════════════════════════════════════════════════════════════
function InformeModal({ msg, onClose, origin }) {
  var tipoInforme = detectarTipoInforme(msg);
  var [fase, setFase]               = useState("init");
  var [informeHtml, setInformeHtml] = useState("");
  var [errorMsg, setErrorMsg]       = useState("");
  var [blobUrl, setBlobUrl]         = useState(null);
  var iframeRef    = useRef(null);
  var blobUrlRef   = useRef(null);
  var isDispositivo = tipoInforme === "dispositivo";
  var serial = isDispositivo ? parsearDatosDispositivo(msg).serial : "";
  var nombreArchivo = isDispositivo
    ? "Informe_Dispositivo_"+serial+"_"+new Date().toISOString().slice(0,10)+".html"
    : "Informe_Flota_"+new Date().toISOString().slice(0,10)+".html";

  useEffect(function(){ lanzarGeneracion(); }, []);

  // Revoca el blob URL anterior cuando se actualiza
  useEffect(function(){
    if (blobUrl) {
      if (iframeRef.current) iframeRef.current.src = blobUrl;
      blobUrlRef.current = blobUrl;
    }
  }, [blobUrl]);

  // Limpieza al desmontar
  useEffect(function(){
    return function(){ if(blobUrlRef.current) URL.revokeObjectURL(blobUrlRef.current); };
  }, []);

  function mostrarEnIframe(html) {
    if (blobUrlRef.current) URL.revokeObjectURL(blobUrlRef.current);
    var blob = new Blob([html], {type:"text/html;charset=utf-8"});
    var url  = URL.createObjectURL(blob);
    setBlobUrl(url);
  }

  async function lanzarGeneracion() {
    setFase("loading");
    try {
      var iData = msg.informe_data || null;
      var final = "";
      if (isDispositivo) {
        var datos    = parsearDatosDispositivo(msg);
        var analisis = await generarAnalisisIA("dispositivo", iData);
        final = generarInformeDispositivo(datos, msg.html||"", analisis);
      } else {
        var analisis2 = await generarAnalisisIA("flota", iData);
        final = generarInformeFlota(msg.html, analisis2, iData);
      }
      setInformeHtml(final);
      mostrarEnIframe(final);
      setFase("listo");
    } catch(err) {
      console.error(err);
      setErrorMsg(err.message);
      setFase("error");
    }
  }

  function abrirEnPestana() {
    if (informeHtml) {
      var win = window.open("","_blank");
      if (win) { win.document.write(informeHtml); win.document.close(); }
    }
  }

  function generarSinIA() {
    var iData = msg.informe_data || null;
    var final = "";
    if (isDispositivo) {
      var datos = parsearDatosDispositivo(msg);
      final = generarInformeDispositivo(datos, msg.html||"", "");
    } else {
      final = generarInformeFlota(msg.html, "", iData);
    }
    setInformeHtml(final);
    mostrarEnIframe(final);
    setFase("listo");
  }

  var tipoLabel = isDispositivo ? "📱 Dispositivo"+(serial?" · "+serial:"") : "📊 Flota";

  // ── Motion del modal (solo visual) ──
  var [closing,setClosing]=useState(false);
  var [step,setStep]=useState(0);
  var handleClose=function(){ setClosing(true); setTimeout(onClose,250); };
  var originStyle=origin?{"--dx":(origin.x-window.innerWidth/2)+"px","--dy":(origin.y-window.innerHeight/2)+"px"}:{};
  useEffect(function(){
    if(fase!=="loading") return;
    setStep(0);
    var t1=setTimeout(function(){setStep(1);},900), t2=setTimeout(function(){setStep(2);},2600);
    return function(){clearTimeout(t1);clearTimeout(t2);};
  },[fase]);
  useEffect(function(){
    var h=function(e){if(e.key==="Escape")handleClose();};
    document.addEventListener("keydown",h); return function(){document.removeEventListener("keydown",h);};
  },[]);
  var pasos=["Recopilando datos","Análisis IA","Componiendo informe"];

  return (
    <div className={"modal-overlay"+(closing?" closing":"")} onClick={function(e){ if(e.target===e.currentTarget) handleClose(); }}>
      <div className="modal-box" style={originStyle}>
        <div className="modal-header">
          <div className="modal-title">
            <Icon n="file"/> Informe Técnico
            <span className="m-chip type">{isDispositivo ? "Dispositivo"+(serial?" · "+serial:"") : "Flota"}</span>
            {fase==="listo" && <span className="m-chip ok">✓ Listo</span>}
          </div>
          <div className="modal-header-actions">
            {fase==="listo" && <>
              <button className="modal-action-btn btn-download" onClick={function(){ descargarHtml(informeHtml, nombreArchivo); }}><Icon n="download"/><span className="txt">Descargar HTML</span></button>
              <button className="modal-action-btn btn-newtab"   onClick={abrirEnPestana}><Icon n="external"/><span className="txt">Abrir en pestaña</span></button>
            </>}
            <button className="btn-close" onClick={handleClose} title="Cerrar"><Icon n="x"/></button>
          </div>
        </div>
        <div className="modal-body">
          {fase==="loading" && (
            <div className="modal-loading">
              <div style={{width:"110px",height:"110px"}}><Orb state="thinking" expression="thinking" size={110}/></div>
              <p>Generando informe {isDispositivo?"de dispositivo":"de flota"}…</p>
              <div className="steps">
                {pasos.map(function(p,i){return (
                  <React.Fragment key={i}>
                    {i>0 && <div className={"step-line"+(step>=i?" done":"")}/>}
                    <div className={"step"+(step===i?" active":step>i?" done":"")}><span className="num">{step>i?"✓":(i+1)}</span>{p}</div>
                  </React.Fragment>
                );})}
              </div>
            </div>
          )}
          {fase==="error" && (
            <div className="modal-loading">
              <div style={{width:"96px",height:"96px"}}><Orb state="idle" expression="sad" size={96}/></div>
              <p style={{color:"#f87171",fontWeight:600}}>Error al generar análisis IA</p>
              <p style={{fontSize:"12px",color:"var(--text-muted)",maxWidth:"320px",textAlign:"center"}}>{errorMsg}</p>
              <div style={{display:"flex",gap:"10px",marginTop:"8px",flexWrap:"wrap",justifyContent:"center"}}>
                <button className="modal-action-btn btn-newtab" onClick={function(){setFase("loading");lanzarGeneracion();}}><Icon n="refresh"/>Reintentar</button>
                <button className="modal-action-btn btn-download" onClick={generarSinIA}><Icon n="file"/>Informe sin IA</button>
              </div>
            </div>
          )}
          {fase==="listo" && (
            <iframe ref={iframeRef} className="modal-iframe" title="Informe Técnico"
              style={{flex:1,width:"100%",height:"100%",minHeight:0,border:"none",display:"block",background:"#fff"}}
            />
          )}
        </div>
      </div>
    </div>
  );
}

function useBlobReady() {
  var [ready,setReady]=useState(!!window.BLOBATAR);
  useEffect(function(){
    if(ready) return;
    var h=function(){setReady(true);};
    window.addEventListener("blobatar-ready",h);
    if(window.BLOBATAR) setReady(true);
    return function(){window.removeEventListener("blobatar-ready",h);};
  },[]);
  return ready;
}

function useRotating(list, active, ms) {
  var [i,setI]=useState(0);
  useEffect(function(){
    if(!active){ setI(0); return; }
    var t=setInterval(function(){ setI(function(x){return x+1;}); }, ms||1700);
    return function(){clearInterval(t);};
  },[active,list]);
  return list[i%list.length];
}

function useCountUp(target, dur, delay) {
  var [v,setV]=useState(0);
  useEffect(function(){
    if(target==null||isNaN(target)) return;
    var raf, start=null;
    var t0=setTimeout(function(){
      var tick=function(ts){
        if(!start) start=ts;
        var p=Math.min(1,(ts-start)/dur), e=1-Math.pow(1-p,3);
        setV(Math.round(target*e));
        if(p<1) raf=requestAnimationFrame(tick);
      };
      raf=requestAnimationFrame(tick);
    }, delay||0);
    return function(){clearTimeout(t0);cancelAnimationFrame(raf);};
  },[target]);
  return v;
}

/* Blobatar (blobatar.dev): mismo render que @blobatar/react, sin bundler.
   Expresiones como estado: cambian solo variables CSS → morph fluido. */
function BlobAvatar(props) {
  var name=props.name, size=props.size||40, expression=props.expression||"idle", animate=props.animate||"always";
  var ready=useBlobReady();
  var svgRef=useRef(null), gazeRef=useRef(null);
  var palKey=props.palette?JSON.stringify(props.palette):"";
  var parts=useMemo(function(){
    if(!ready) return null;
    var B=window.BLOBATAR, ex=B.expr[expression]||B.expr.idle;
    try{ return B.parts(name,{animate:animate,palette:props.palette,expression:ex}); }
    catch(e){ console.warn("blobatar",e); return null; }
  },[ready,name,expression,animate,palKey]);
  var inner=parts?parts.inner:"";
  var html=useMemo(function(){return {__html:inner};},[inner]);
  var hasParts=!!parts;

  useEffect(function(){
    if(!hasParts||!props.gaze||!svgRef.current||!window.BLOBATAR.gaze) return;
    var g;
    try{ g=window.BLOBATAR.gaze(svgRef.current); svgRef.current.style.setProperty("--mo-track-travel",(props.travel||3)+"px"); gazeRef.current=g; }
    catch(e){ return; }
    return function(){ try{g.stop();}catch(e){} gazeRef.current=null; };
  },[hasParts,props.gaze]);
  useEffect(function(){
    if(!gazeRef.current) return;
    try{ gazeRef.current.lookAt(props.gazeTarget===undefined?"pointer":props.gazeTarget); }catch(e){}
  },[props.gazeTarget,hasParts,props.gaze]);

  if(!parts) return <div className="orb-fallback" style={{width:size*0.62,height:size*0.62,margin:"auto"}}/>;
  return (
    <svg ref={svgRef} className={"blob-mini"+(props.className?" "+props.className:"")} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
      width={size} height={size} aria-hidden="true" style={parts.vars}>
      {parts.bg ? <path d={parts.bg.d} fill={parts.bg.fill}/> : null}
      <g className={parts.cls} dangerouslySetInnerHTML={html}/>
    </svg>
  );
}

function SofiaMini({ size, expression }) {
  return <BlobAvatar name={SOFIA_NAME} palette={SOFIA_PALETTE} size={size||30} expression={expression} animate="always"/>;
}

/* Orbe: blobatar + halo + anillos. state: idle | thinking | listening | happy */

}

function MessageBubble({ msg, onSendMessage, groupStart, userName }) {
  var isUser         = msg.role === "user";

  var muestraInforme = tipoInforme !== "ninguno";
